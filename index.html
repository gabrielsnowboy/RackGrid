<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RackGrid: track server racks, network cables, IP addresses, site floor plans and wall ports in your browser.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2022%2022%22%3E%3Crect%20x%3D%222%22%20y%3D%221.5%22%20width%3D%2218%22%20height%3D%2219%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20stroke%3D%22%231d5bd3%22%20stroke-width%3D%221.8%22/%3E%3Crect%20x%3D%225%22%20y%3D%225%22%20width%3D%2212%22%20height%3D%223%22%20fill%3D%22%231d5bd3%22/%3E%3Crect%20x%3D%225%22%20y%3D%229.5%22%20width%3D%2212%22%20height%3D%223%22%20fill%3D%22%231d5bd3%22%20opacity%3D%22.6%22/%3E%3Crect%20x%3D%225%22%20y%3D%2214%22%20width%3D%2212%22%20height%3D%223%22%20fill%3D%22%231d5bd3%22%20opacity%3D%22.35%22/%3E%3C/svg%3E">
<title>RackGrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: three-pane console — library/racks | rack elevation with cable gutter | inspector */
:root{
  --bg:#e9edf1; --panel:#ffffff; --rack:#f6f8fa; --rail:#dfe4ea;
  --ink:#15202b; --muted:#5c6876; --line:#d2d9e1; --soft:#eef2f6;
  --accent:#1d5bd3; --accent-soft:#e3ecfd; --port:#ffffff; --port-edge:#8a96a4;
  --port-on:#1a2531; --warn:#b4410f; --warn-soft:#fdebe2; --ok:#17784a;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-tag:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#151c23; --rack:#11171d; --rail:#232d37;
  --ink:#e4e9ee; --muted:#8a96a3; --line:#28323c; --soft:#1b232b;
  --accent:#6b9dff; --accent-soft:#1c2a44; --port:#0e1318; --port-edge:#5f6c79;
  --port-on:#d7dee6; --warn:#ff8a57; --warn-soft:#3a2016; --ok:#4cc38a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#151c23; --rack:#11171d; --rail:#232d37;
  --ink:#e4e9ee; --muted:#8a96a3; --line:#28323c; --soft:#1b232b;
  --accent:#6b9dff; --accent-soft:#1c2a44; --port:#0e1318; --port-edge:#5f6c79;
  --port-on:#d7dee6; --warn:#ff8a57; --warn-soft:#3a2016; --ok:#4cc38a; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;gap:0;height:100%;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.pane{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-width:0}
.pane.right{border-right:0;border-left:1px solid var(--line)}
.center{display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand b{font-family:var(--f-tag);font-size:22px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.brand svg{flex:none}
.sec{padding:10px 16px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.racklist{display:flex;flex-direction:column;gap:2px}
.racklist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px}
.racklist button:hover{background:var(--soft)}
.racklist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.racklist small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.lib{display:flex;flex-direction:column;gap:2px}
.lib button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;padding:6px 8px;border-radius:6px;text-align:left;cursor:grab}
.lib button:hover{background:var(--soft);border-color:var(--line)}
.lib .glyph{width:34px;height:14px;border:1.5px solid var(--port-edge);border-radius:2px;flex:none;display:grid;grid-auto-flow:column;gap:1px;padding:2px}
.lib .glyph i{background:var(--port-edge);border-radius:1px}
.lib small{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:6px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--port-edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn.danger.arm{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{min-width:0}
.crumb h1{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.crumb p{margin:0;color:var(--muted);font-size:12px}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);min-width:0;flex:0 1 280px}
.search input{border:0;background:none;outline:0;min-width:0;width:100%}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:7px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:5px;font-weight:500;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--panel)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.stage{flex:1;overflow:auto;padding:24px 16px 40px}
.rackwrap{position:relative;margin:0 auto;width:max-content;padding-right:100px}
.rack{position:relative;z-index:1;display:grid;grid-template-columns:40px 680px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 0 14px 0}
.ucol{position:relative}
.ucol span{position:absolute;right:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateY(-50%)}
.body{position:relative;background:var(--rack);border-left:10px solid var(--rail);border-right:10px solid var(--rail);margin-right:14px}
.slot{position:absolute;left:0;right:0;border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.slot:hover{color:var(--muted);background:var(--soft)}
.slot.pick{background:var(--accent-soft);color:var(--accent)}
.ghost{position:absolute;left:0;right:0;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:4px;pointer-events:none;z-index:4;opacity:.9}
.ghost.bad{border-color:var(--warn);background:var(--warn-soft)}

.dev{position:absolute;left:0;right:0;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:3px;z-index:2;cursor:pointer;transition:box-shadow .12s}
.dev:hover{box-shadow:0 0 0 1px var(--port-edge)}
.dev.sel{box-shadow:0 0 0 2px var(--accent);z-index:3}
.dev.dim{opacity:.35}
.dev.hit{box-shadow:0 0 0 2px var(--ok)}
.dev .tag{width:30px;flex:none;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);background:var(--soft);cursor:grab;
  background-image:radial-gradient(var(--port-edge) 1px,transparent 1.2px);background-size:5px 5px;background-position:center}
.dev .tag b{background:var(--soft);padding:2px 0}
.dev{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dev.dragging{z-index:20;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.25),0 0 0 2px var(--accent);opacity:.92;transition:none}
.dev.dragging .port{pointer-events:none}
body.dragging-any,body.dragging-any *{cursor:grabbing!important;user-select:none!important}
.ghost::after{content:attr(data-label);position:absolute;left:calc(100% + 18px);top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);white-space:nowrap;background:var(--panel);padding:2px 6px;border-radius:4px;border:1px solid var(--accent)}
.ghost.bad::after{color:var(--warn);border-color:var(--warn)}
.dragchip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;font-weight:600;padding:5px 10px;border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cables.hide{opacity:0}
.dev .rz{position:absolute;left:30px;right:0;bottom:-3px;height:8px;cursor:ns-resize;z-index:4;touch-action:none}
.dev .rz::after{content:"";position:absolute;left:50%;bottom:3px;width:34px;height:3px;margin-left:-17px;border-radius:2px;background:var(--port-edge);opacity:0;transition:opacity .12s}
.dev:hover .rz::after,.dev.sel .rz::after,.dev.resizing .rz::after{opacity:.9}
.dev.resizing{z-index:20;box-shadow:0 0 0 2px var(--accent);transition:none}
.face .meta small.due{color:var(--warn);font-weight:600}
.face.batt{background:repeating-linear-gradient(90deg,transparent 0 3px,var(--soft) 3px 4px)}
.face.batt .cells{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;max-width:260px;justify-content:flex-end;align-content:center;height:100%;padding:4px 0}
.face.batt .cells i{width:38px;height:12px;border:1.5px solid var(--port-edge);border-radius:2px;position:relative;background:linear-gradient(90deg,var(--ok) 0 70%,transparent 70%);opacity:.8}
.face.batt .cells i::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--port-edge)}
.cx-preview{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:-4px 0 14px}
.lib button{touch-action:manipulation}
.dev .tag b{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-tag);font-size:12px;letter-spacing:.04em;font-weight:600;white-space:nowrap;overflow:hidden;max-height:100%}
.dev.type-patch .tag,.dev.type-patch48 .tag,.dev.type-fiber .tag{background:var(--accent-soft)}
.dev.type-fiber .tag b{color:var(--accent)}
.face{flex:1;display:flex;align-items:center;gap:10px;padding:0 8px;min-width:0;overflow:hidden}
.face .meta{display:flex;flex-direction:column;min-width:56px;max-width:110px;flex:1 1 auto;line-height:1.15}
.face .meta b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face .meta small{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face.blank{background:repeating-linear-gradient(90deg,transparent 0 6px,var(--soft) 6px 8px)}
.face.mgr{background:repeating-linear-gradient(90deg,var(--soft) 0 18px,transparent 18px 26px)}
.ports{display:flex;gap:10px;align-items:center;margin-left:auto}
.grp{display:flex;gap:2px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:1px}
.pcol em{font-style:normal;font-family:var(--f-mono);font-size:8px;line-height:9px;color:var(--muted);height:9px}
.port{width:14px;height:11px;padding:0;border:1.5px solid var(--port-edge);background:var(--port);border-radius:1.5px;position:relative;display:block}
.port.rj45::after{content:"";position:absolute;left:3px;right:3px;bottom:-1.5px;height:3px;background:var(--rack);border:1.5px solid var(--port-edge);border-bottom:0}
.port.sfp{width:18px;height:10px;border-radius:1px}
.port.lc{width:16px;height:11px;border-radius:5px}
.port.on{background:var(--port-on);border-color:var(--port-on)}
.port.on::after{background:var(--port-on);border-color:var(--port-on)}
.port.ext{background:repeating-linear-gradient(45deg,var(--port-on) 0 2px,var(--port) 2px 4px)}
.port .ipdot{position:absolute;top:-4px;right:-4px;width:6px;height:6px;border-radius:50%;background:var(--ok);border:1px solid var(--panel)}
.port .ipdot.dup{background:var(--warn)}
.port.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.port.peer{outline:2px dashed var(--accent);outline-offset:1px}
.port.hit{outline:2px solid var(--ok);outline-offset:1px}
.port .cc{position:absolute;left:-1px;right:-1px;bottom:-5px;height:2px;border-radius:1px}
.cables{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.cables.under{z-index:0}
.cables path{fill:none;stroke-width:1.8;opacity:.7;stroke-linejoin:round;stroke-linecap:round}
.cables path.cold{opacity:.25}
.cables path.lit{opacity:1;stroke-width:2.6}
.cables path.casing{stroke:var(--panel);stroke-width:6;opacity:.85}
.cables path.hot{stroke-width:2.6;opacity:1}
.cables .end{stroke:var(--panel);stroke-width:1.5}
.cables path.moving{opacity:.12}
.cables .dragline{stroke-width:2.6;stroke-dasharray:6 4;opacity:1;fill:none}
.cables .dragdot{opacity:1}
.port.on{cursor:grab}
.port.dragsrc{outline:2px dashed var(--accent);outline-offset:2px}
.port.drop-ok{outline:2px solid var(--ok);outline-offset:2px;transform:scale(1.3);z-index:3}
.port.drop-bad{outline:2px solid var(--warn);outline-offset:2px}

/* table tab */
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:20px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.mono,.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tblhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px}
.tblhead h2{font-size:15px;margin:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;background:var(--soft);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{color:var(--ok)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--line);vertical-align:-1px}

/* inspector */
.insp{padding:16px}
.insp h2{margin:0;font-size:17px;font-weight:600}
.insp .sub{color:var(--muted);font-size:12px;margin:2px 0 14px;font-family:var(--f-mono)}
.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:10px;font-weight:500;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;margin-bottom:16px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
.fields label.full{grid-column:1/-1}
.fields input,.fields select,.fields textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);min-width:0;width:100%}
.fields input.mono{font-family:var(--f-mono);font-size:12px}
.fields input.bad{border-color:var(--warn);background:var(--warn-soft)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.stat{background:var(--soft);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plist{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px;max-height:340px;overflow-y:auto}
.plist button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 8px;text-align:left;font-size:12px}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:var(--soft)}
.plist .n{font-family:var(--f-mono);color:var(--muted)}
.plist .to{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .ip{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sech{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 8px}
.empty{padding:20px 16px;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px}

.emptyrack{max-width:420px;margin:60px auto;text-align:center;color:var(--muted)}
.emptyrack h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.emptyrack .btnrow{justify-content:center;margin-top:14px}

/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:min(620px,100%);max-height:90%;overflow:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px;font-family:var(--f-mono);font-size:12px}
.modal pre{background:var(--soft);padding:8px 10px;border-radius:6px;font-family:var(--f-mono);font-size:11px;overflow-x:auto}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1000px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .pane.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  html,body{height:auto}
  .app{height:auto}
  .center{min-height:70vh}
}
@media (max-width:680px){
  .app{grid-template-columns:minmax(0,1fr);padding-left:0;padding-right:0}
  .pane{border-right:0;border-bottom:1px solid var(--line)}
  .sec,.brand,.bar,.insp{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lib{display:grid;grid-template-columns:1fr 1fr}
  .search{flex-basis:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* sites */
.sitepick{position:relative;padding:0 12px 12px}
.sitebtn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;text-align:left}
.sitebtn:hover{border-color:var(--port-edge)}
.sitebtn .pin-ico{flex:none;color:var(--accent)}
.sitebtn span{display:flex;flex-direction:column;min-width:0;flex:1}
.sitebtn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitebtn small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitemenu{position:absolute;left:12px;right:12px;top:calc(100% - 6px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.18);z-index:30;padding:4px;max-height:320px;overflow:auto}
.sitemenu button{display:flex;flex-direction:column;width:100%;border:0;background:none;text-align:left;padding:7px 9px;border-radius:6px}
.sitemenu button:hover{background:var(--soft)}
.sitemenu button.on{background:var(--accent-soft)}
.sitemenu button.on b{color:var(--accent)}
.sitemenu small{color:var(--muted);font-size:11px}
.sitemenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.sitemenu .add{flex-direction:row;color:var(--accent);font-weight:600}

<script>
(() => {
const UH = 34;
const COLORS = {blue:"#2f6fe0",yellow:"#e0b21a",green:"#2f9e55",red:"#d6403a",orange:"#e5772b",purple:"#8a4fd6",white:"#c9d0d8",black:"#3a4450",grey:"#8b95a1",aqua:"#1fb5c9",pink:"#e05aa6"};
const TYPES = {
  patch:  {label:"Patch Panel 24-port", h:1, ports:[["rj45",24]], code:"PP"},
  patch48:{label:"Patch Panel 48-port", h:1, ports:[["rj45",48]], code:"PP"},
  fiber:  {label:"Fiber Patch Panel", h:1, ports:[["lc",24]], code:"FPP"},
  switch: {label:"Switch 24-port", h:1, ports:[["rj45",24],["sfp",4]], code:"SW"},
  switch48:{label:"Switch 48-port", h:1, ports:[["rj45",48],["sfp",4]], code:"SW"},
  router: {label:"Router", h:1, ports:[["rj45",4],["sfp",2]], code:"RT"},
  firewall:{label:"Firewall", h:1, ports:[["rj45",8],["sfp",2]], code:"FW"},
  server: {label:"Server", h:2, ports:[["rj45",4],["rj45",1]], code:"SRV"},
  nas:    {label:"Storage / NAS", h:2, ports:[["rj45",4]], code:"NAS"},
  ups:    {label:"UPS", h:2, ports:[["rj45",1]], code:"UPS"},
  battery:{label:"UPS Battery Pack", h:2, ports:[], code:"BAT"},
  pdu:    {label:"PDU", h:1, ports:[], code:"PDU"},
  manager:{label:"Cable Manager", h:1, ports:[], code:"CM"},
  shelf:  {label:"Shelf / Tray", h:1, ports:[], code:"SH"},
  blank:  {label:"Blank Panel", h:1, ports:[], code:"BL"},
  custom: {label:"Custom Device…", h:1, ports:[["rj45",8]], code:"DEV"},
};
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2,"0");

/* ---------- state ---------- */
const S = {racks:{}, sites:{}, plans:{}};
let curSite=null, curId=null, curFloor=null, view="site";
let sel={dev:null,port:null,slot:null,pin:null};
let showCov=true;
let q="", showCables=true, loaded=false, readOnly=false, armed=null, menuOpen=false, placeMode=null, zoom=1;

const site = () => S.sites[curSite] || null;
const rack = () => S.racks[curId] || null;
const sortBy = (obj,f) => Object.keys(obj).sort((a,b)=>(obj[a][f]||"").localeCompare(obj[b][f]||"",undefined,{numeric:true}));
function rackSite(r){ return S.sites[r.siteId] ? r.siteId : null; }
function siteRacks(){ return sortBy(S.racks,"name").map(id=>S.racks[id]).filter(r=>rackSite(r)===curSite || rackSite(r)===null); }
function floor(){ const s=site(); if(!s) return null; return s.floors.find(f=>f.id===curFloor) || s.floors[0] || null; }
function devById(r,id){ return r?.devices.find(d => d.id === id); }
function makePorts(spec){ const out=[]; let n=1; for(const [kind,count] of spec) for(let i=0;i<count;i++) out.push({n:n++,kind,label:"",ip:"",vlan:"",mac:"",link:null,ext:"",cable:"",color:"",len:"",note:""}); return out; }
function nextName(r,type){ const code=TYPES[type]?.code||"DEV"; let i=1; const names=new Set(r.devices.map(d=>d.name)); while(names.has(code+pad2(i))) i++; return code+pad2(i); }
function fits(r,u,h,ignore){ if(u<1||u+h-1>r.units) return false; return !r.devices.some(d => d.id!==ignore && u <= d.u+d.h-1 && d.u <= u+h-1); }
function firstFree(r,h){ for(let top=r.units; top>=h; top--){ const u=top-h+1; if(fits(r,u,h)) return u; } return null; }
function newDevice(r,type,u){ const t=TYPES[type]; return {id:uid(),name:nextName(r,type),type,u,h:t.h,model:"",serial:"",ip:"",notes:"",ports:makePorts(t.ports)}; }
const today = () => new Date().toISOString().slice(0,10);
function battDue(d){ return (d.type==="ups"||d.type==="battery") && d.replaceBy && d.replaceBy<=today(); }
function setPortCounts(r,d,want){
  const keep={rj45:[],sfp:[],lc:[]}; d.ports.forEach((pt,i)=>keep[pt.kind]?.push(i));
  for(const k in keep) keep[k].slice(want[k]).forEach(i=>unlinkPort(r,d,i));
  const old=d.ports, map={}, np=[]; let n=1;
  for(const k of ["rj45","sfp","lc"]) for(let i=0;i<Math.min(200,want[k]||0);i++){ const oi=keep[k][i]; const pt=oi!=null?{...old[oi]}:makePorts([[k,1]])[0]; pt.n=n++; if(oi!=null) map[oi]=np.length; np.push(pt); }
  for(const o of r.devices) o.ports.forEach(op=>{ if(op.link&&op.link.d===d.id&&o.id!==d.id) op.link.p=map[op.link.p]; });
  np.forEach(pt=>{ if(pt.link&&pt.link.d===d.id) pt.link.p=map[pt.link.p]; });
  for(const x of pinsAll()){ for(const jpo of jp(x.p)) if(jpo.link?.r===r.id && jpo.link.d===d.id && jpo.link.p!=null){ const m=map[jpo.link.p]; jpo.link.p = m==null?null:m; persist("sites",x.s.id); }
    const u=x.p.kind==="ap"?x.p.up:null; if(u?.r===r.id&&u.d===d.id&&u.p!=null){ const m=map[u.p]; u.p = m==null?null:m; persist("sites",x.s.id); } }
  d.ports=np;
}
/* cable length check: recorded length vs. the run between the two devices */
function parseLen(v){ const m=String(v||"").trim().toLowerCase().replace(",",".").match(/^([\d.]+)\s*(m|meters?|metres?|cm|mm|ft|feet|foot|'|in|inch|inches|")?$/); if(!m) return null;
  const n=parseFloat(m[1]); if(!isFinite(n)) return null; const u=m[2]||"m";
  return u==="cm"?n/100 : u==="mm"?n/1000 : (u==="ft"||u==="feet"||u==="foot"||u==="'")?n*.3048 : (u.startsWith("in")||u==='"')?n*.0254 : n; }
function runLen(a,b){ const du=Math.abs((a.u+(a.h-1)/2)-(b.u+(b.h-1)/2)); return du*.04445 + (du<=2 ? .15 : .5); }
function shortCable(r,d,p){ const pt=d.ports[p]; if(!pt?.link) return null; const o=devById(r,pt.link.d), have=parseLen(pt.len); if(!o||have==null) return null;
  const need=runLen(d,o); return have+.005<need ? {have,need,o,op:pt.link.p} : null; }
const fmtM = m => m<1 ? Math.round(m*100)+" cm" : m.toFixed(1).replace(/\.0$/,"")+" m";
function portName(d,p){ const pt=d.ports[p]; if(!pt) return d.name+" · ?"; return `${d.name} · ${pt.kind==="sfp"?"SFP ":""}${pt.n}${pt.label?` (${pt.label})`:""}`; }

function unlinkPort(r,d,p){ const pt=d.ports[p]; if(pt.link){ const o=devById(r,pt.link.d); if(o&&o.ports[pt.link.p]){ const op=o.ports[pt.link.p]; if(op.link&&op.link.d===d.id&&op.link.p===p) op.link=null; } pt.link=null; } }
function linkPorts(r,a,pa,b,pb){ unlinkPort(r,a,pa); unlinkPort(r,b,pb); a.ports[pa].ext=""; b.ports[pb].ext="";
  a.ports[pa].link={d:b.id,p:pb}; b.ports[pb].link={d:a.id,p:pa};
  const A=a.ports[pa],B=b.ports[pb]; for(const k of ["cable","color","len"]){ const v=A[k]||B[k]; A[k]=v; B[k]=v; } }
function syncCable(r,d,p){ const pt=d.ports[p]; if(!pt.link) return; const o=devById(r,pt.link.d); if(!o) return; const op=o.ports[pt.link.p]; for(const k of ["cable","color","len"]) op[k]=pt[k]; }

/* wall ports */
function pinsAll(){ const out=[]; for(const s of Object.values(S.sites)) for(const p of (s.pins||[])) out.push({s,p}); return out; }
/* a wall port (jack plate) has one or more ports: A, B, C… each patched and used separately */
const newJackPort = () => ({link:null,cable:"",endpoint:"",eip:"",mac:""});
function jp(p){ if(p.kind!=="jack") return [];
  if(!Array.isArray(p.ports)){ p.ports=[{link:p.link||null,cable:p.cable||"",endpoint:p.endpoint||"",eip:p.eip||"",mac:p.mac||""}]; for(const k of ["link","cable","endpoint","eip","mac"]) delete p[k]; }
  if(!p.ports.length) p.ports.push(newJackPort()); return p.ports; }
const letter = j => String.fromCharCode(65+j);
function jname(p,j){ return jp(p).length>1 ? `${p.label||"?"} ${letter(j)}` : (p.label||"?"); }
function jackMap(){ const m={}; for(const {s,p} of pinsAll()) jp(p).forEach((x,j)=>{ if(x.link&&x.link.p!=null) m[`${x.link.r}:${x.link.d}:${x.link.p}`]={s,p,j,x}; }); return m; }
function floorName(s,fid){ return s.floors.find(f=>f.id===fid)?.name || "—"; }
function trace(p,j=0){
  const L=jp(p)[j]?.link; if(!L||L.p==null) return null;
  const r=S.racks[L.r], d=devById(r,L.d); if(!r||!d||!d.ports[L.p]) return null;

async function flush(c,id){

  try{ if(S[c][id]) await cols[c].doc(id).set(S[c][id]); else await cols[c].doc(id).delete(); }
  catch(e){
    if(e?.code==="invalid_argument" && S[c][id]){ if(c==="plans") toast("That floor plan is too large to save here. Try a smaller image."); else { readOnly=true; toast("You can view this site but don't have permission to edit it."); render(); } }
    else if(e?.code==="quota_exceeded") toast("Storage is full. Delete something you no longer need and try again.");

async function boot(){

  if(!db){ mode="local"; for(const c of ["racks","sites","plans"]){ try{ S[c]=JSON.parse(localStorage.getItem(LSKEY[c])||"{}")||{}; }catch(e){ S[c]={}; } }
    loaded=true; pickDefaults(); render(); return; }
  mode="db"; for(const c of ["racks","sites","plans"]) cols[c]=db.collection(c);
  const ready={racks:false,sites:false};
  const t=setTimeout(()=>{ if(!loaded){ $("#rackTitle").textContent="Can't reach your saved sites yet"; $("#rackSub").textContent="Still trying. Check your connection."; } },10000);
  for(const c of ["racks","sites"]){
    cols[c].onSnapshot(snap=>{
      const seen=new Set();
      for(const doc of snap.docs){ seen.add(doc.id); if(!dirty.has(c+"/"+doc.id)) S[c][doc.id]=clone(doc.data()); }
      for(const id of Object.keys(S[c])) if(!seen.has(id) && !dirty.has(c+"/"+id)) delete S[c][id];
      if(!snap.metadata.fromCache || snap.size) ready[c]=true;
      if(ready.racks&&ready.sites){ clearTimeout(t); loaded=true; }
      pickDefaults(); if(!pd) render();
    }, ()=>{ clearTimeout(t); loaded=true; toast("Lost connection to your saved data. Reload to reconnect."); render(); });
  }
}

// Cables run along the seams between devices and down a gutter beside the rack.
// Unselected cables sit behind the rack, so only the gutter bundle shows; the selected
// cable is drawn on top with an outline so it stays readable over the devices.
function roundPath(pts,rad){
  const P=[]; for(const p of pts){ const l=P[P.length-1]; if(!l||Math.abs(l[0]-p[0])>.5||Math.abs(l[1]-p[1])>.5) P.push(p); }
  for(let i=1;i<P.length-1;i++){ const [a,b,c]=[P[i-1],P[i],P[i+1]]; if((Math.abs(a[0]-b[0])<.5&&Math.abs(b[0]-c[0])<.5)||(Math.abs(a[1]-b[1])<.5&&Math.abs(b[1]-c[1])<.5)){ P.splice(i,1); i--; } }
  let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i=1;i<P.length;i++){ const b=P[i];
    if(i<P.length-1){ const a=P[i-1], c=P[i+1]; const l1=Math.hypot(b[0]-a[0],b[1]-a[1]), l2=Math.hypot(c[0]-b[0],c[1]-b[1]); const r=Math.min(rad,l1/2,l2/2);
      const p1=[b[0]-(b[0]-a[0])/l1*r,b[1]-(b[1]-a[1])/l1*r], p2=[b[0]+(c[0]-b[0])/l2*r,b[1]+(c[1]-b[1])/l2*r];
      d+=` L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q${b[0].toFixed(1)} ${b[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
    else d+=` L${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
  return d;
}
function drawCables(){
  const svg=$("#cables"), under=$("#cablesUnder"), rw=$("#rw"), r=rack(); if(!svg||!under||!rw||!r) return;
  if(!showCables){ svg.innerHTML=""; under.innerHTML=""; return; }
  const box=rw.getBoundingClientRect(), rk=rw.querySelector(".rack").getBoundingClientRect();
  const gut=rk.right-box.left+10; let lane=0, top="", low="";
  const seen=new Set(), selKey = sel.port!=null ? `${sel.dev}:${sel.port}` : null, any=!!(selKey||sel.dev);
  const endOf=el=>{ const pr=el.getBoundingClientRect(), dr=el.closest(".dev").getBoundingClientRect();
    const x=pr.left-box.left+pr.width/2, y=pr.top-box.top+pr.height/2, upper=y < (dr.top-box.top+dr.height/2);
    return {x,y,seam: upper ? dr.top-box.top-1.5 : dr.bottom-box.top+1.5, py: upper ? pr.top-box.top : pr.bottom-box.top}; };
  for(const d of r.devices) d.ports.forEach((pt,i)=>{
    if(!pt.link) return; const ka=`${d.id}:${i}`, kb=`${pt.link.d}:${pt.link.p}`, key=[ka,kb].sort().join("|"); if(seen.has(key)) return; seen.add(key);
    const a=rw.querySelector(`.port[data-d="${d.id}"][data-p="${i}"]`), b=rw.querySelector(`.port[data-d="${pt.link.d}"][data-p="${pt.link.p}"]`);
    if(!a||!b) return;
    const A=endOf(a), B=endOf(b), lx=gut+(lane++%14)*6;
    const path=roundPath([[A.x,A.py],[A.x,A.seam],[lx,A.seam],[lx,B.seam],[B.x,B.seam],[B.x,B.py]],6);
    const hot = !!selKey && (ka===selKey||kb===selKey), lit = !selKey && sel.dev && (d.id===sel.dev||pt.link.d===sel.dev);
    const c=COLORS[pt.color]||pt.color||"var(--accent)", sh=shortCable(r,d,i)?' stroke-dasharray="7 5"':"";
    if(hot){ top+=`<path class="casing" d="${path}"/><path class="hot" stroke="${c}"${sh} d="${path}"/><circle class="end" cx="${A.x}" cy="${A.py}" r="3" fill="${c}"/><circle class="end" cx="${B.x}" cy="${B.py}" r="3" fill="${c}"/>`; }
    else low+=`<path class="${lit?"lit":any?"cold":""}" stroke="${c}"${sh} d="${path}"/>`;
  });

  under.innerHTML=low; svg.innerHTML=top;
}

/* move one end of a cable to another port; the other end stays put */
function canDrop(r,a,i,b,j){
  if(a.id===b.id&&i===j) return {ok:false};
  const src=a.ports[i], tgt=b.ports[j];
  if(src.link&&src.link.d===b.id&&src.link.p===j) return {ok:false,msg:"That's the other end of this cable."};
  if(tgt.link||tgt.ext) return {ok:false,msg:`${portName(b,j)} is already in use. Disconnect it first.`};
  return {ok:true};
}
function movePortEnd(r,a,i,b,j){
  const c=canDrop(r,a,i,b,j); if(!c.ok){ if(c.msg) toast(c.msg); return false; }

/* ---------- floor plan geometry: rotation + crop, kept non-destructive ---------- */
function planGeom(pl){ const W=pl?.w||1600, H=pl?.h||1000, t=(pl?.rot||0)*Math.PI/180, c=Math.abs(Math.cos(t)), s=Math.abs(Math.sin(t));
  const RW=W*c+H*s, RH=W*s+H*c, cr=pl?.crop||{x:0,y:0,w:1,h:1}; return {W,H,t,RW,RH,cr,DW:cr.w*RW,DH:cr.h*RH}; }
function imgStyle(pl){ const g=planGeom(pl); const cx=(g.RW/2-g.cr.x*g.RW)/g.DW*100, cy=(g.RH/2-g.cr.y*g.RH)/g.DH*100;
  return `left:${cx}%;top:${cy}%;width:${g.W/g.DW*100}%;height:${g.H/g.DH*100}%;transform:translate(-50%,-50%) rotate(${pl?.rot||0}deg)`; }
function dispToImg(fx,fy,pl){ const g=planGeom(pl); const xr=g.cr.x*g.RW+fx*g.DW, yr=g.cr.y*g.RH+fy*g.DH, dx=xr-g.RW/2, dy=yr-g.RH/2, c=Math.cos(g.t), s=Math.sin(g.t);
  return {x:c*dx+s*dy+g.W/2, y:-s*dx+c*dy+g.H/2}; }
function imgToRot(x,y,pl){ const g=planGeom(pl), dx=x-g.W/2, dy=y-g.H/2, c=Math.cos(g.t), s=Math.sin(g.t); return {x:c*dx-s*dy+g.RW/2, y:s*dx+c*dy+g.RH/2}; }
function imgToDisp(x,y,pl){ const g=planGeom(pl), r=imgToRot(x,y,pl); return {fx:(r.x-g.cr.x*g.RW)/g.DW, fy:(r.y-g.cr.y*g.RH)/g.DH}; }

     <label class="pe-fine" for="peFine">Straighten <input type="range" id="peFine" min="-45" max="45" step="0.5" value="${fine}"><span class="mono" id="peFineVal">${fine.toFixed(1)}°</span></label>
   </div>

  $("#peCancel").onclick=()=>{ pe=null; closeModal(); };

function peDraw(){
  if(!pe?.img) return; const st=$("#peStage"), cv=$("#peCanvas"); if(!st||!cv) return;
  const g=planGeom({w:pe.w,h:pe.h,rot:pe.rot}); const k=Math.min((st.clientWidth-24)/g.RW,(st.clientHeight-24)/g.RH);
  const cw=Math.max(1,Math.round(g.RW*k)), ch=Math.max(1,Math.round(g.RH*k)), dpr=window.devicePixelRatio||1;
  cv.width=cw*dpr; cv.height=ch*dpr; cv.style.width=cw+"px"; cv.style.height=ch+"px"; $("#peWrap").style.width=cw+"px"; $("#peWrap").style.height=ch+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
  x.save(); x.translate(cw/2,ch/2); x.rotate(g.t); x.drawImage(pe.img,-pe.w*k/2,-pe.h*k/2,pe.w*k,pe.h*k); x.restore();
  // show where wall ports will land
  const s=site(), f=s?.floors.find(z=>z.id===pe.fid);
  for(const p of (s?.pins||[]).filter(p=>p.floor===pe.fid)){ const im=dispToImg(p.x,p.y,f.plan), r=imgToRot(im.x,im.y,{w:pe.w,h:pe.h,rot:pe.rot});
    x.beginPath(); x.arc(r.x*k,r.y*k,4,0,Math.PI*2); x.fillStyle=p.kind==="rack"?"#15202b":"#1d5bd3"; x.fill(); x.lineWidth=1.5; x.strokeStyle="#fff"; x.stroke(); }
  peCropStyle();
}
function peCropStyle(){ const c=pe.crop, el=$("#peCrop"); if(!el) return; Object.assign(el.style,{left:c.x*100+"%",top:c.y*100+"%",width:c.w*100+"%",height:c.h*100+"%"}); }
function bindCrop(){
  const wrap=$("#peWrap"); let dr=null; const MIN=.04;
  wrap.addEventListener("pointerdown",e=>{
    const b=wrap.getBoundingClientRect(), m=e.target.dataset.m || "new";
    const px=(e.clientX-b.left)/b.width, py=(e.clientY-b.top)/b.height;
    dr={m,px,py,b,start:{...pe.crop}}; wrap.setPointerCapture(e.pointerId); e.preventDefault();
    if(m==="new") pe.crop={x:px,y:py,w:0,h:0};
  });
  wrap.addEventListener("pointermove",e=>{
    if(!dr) return; const {b,start:s0}=dr; const px=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)), py=Math.max(0,Math.min(1,(e.clientY-b.top)/b.height));
    const dx=px-dr.px, dy=py-dr.py; let {x,y,w,h}=s0;
    if(dr.m==="move"){ x=Math.max(0,Math.min(1-w,x+dx)); y=Math.max(0,Math.min(1-h,y+dy)); }
    else if(dr.m==="new"){ x=Math.min(dr.px,px); y=Math.min(dr.py,py); w=Math.abs(px-dr.px); h=Math.abs(py-dr.py); }
    else { let x2=x+w, y2=y+h;
      if(dr.m.includes("w")) x=Math.min(x2-MIN,Math.max(0,x+dx)); if(dr.m.includes("e")) x2=Math.max(x+MIN,Math.min(1,x2+dx));
      if(dr.m.includes("n")) y=Math.min(y2-MIN,Math.max(0,y+dy)); if(dr.m.includes("s")) y2=Math.max(y+MIN,Math.min(1,y2+dy));
      w=x2-x; h=y2-y; }
    pe.crop={x,y,w,h}; peCropStyle();
  });
  const end=()=>{ if(!dr) return; if(pe.crop.w<MIN||pe.crop.h<MIN) pe.crop={...dr.start}; dr=null; peCropStyle(); };
  wrap.addEventListener("pointerup",end); wrap.addEventListener("pointercancel",end);
}
function savePlanEdit(){
  const s=site(), f=s?.floors.find(z=>z.id===pe?.fid); if(!f?.plan){ closeModal(); return; }
  const old={...f.plan}, np={...f.plan,rot:pe.rot,crop:{...pe.crop}};
  let edge=0;
  for(const p of (s.pins||[]).filter(p=>p.floor===f.id)){ const im=dispToImg(p.x,p.y,old), d=imgToDisp(im.x,im.y,np);
    if(d.fx<0||d.fx>1||d.fy<0||d.fy>1) edge++; p.x=d.fx; p.y=d.fy; }
  f.plan=np; pe=null; closeModal(); saveSite();

/* ---------- floor plan upload ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej({code:"pdf_load"}); document.head.appendChild(sc); }); }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej({code:"bad_image"}); i.src=src; }); }
function canvasBlob(c,type,q){ return new Promise(res=>c.toBlob(res,type,q)); }
function drawTo(img,max){ const w0=img.naturalWidth||1600, h0=img.naturalHeight||1000, k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement("canvas"); c.width=Math.round(w0*k); c.height=Math.round(h0*k); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); return c; }
async function pdfToBlob(file){
  if(!window.pdfjsLib){ await loadScript(PDFJS+"pdf.worker.min.js"); await loadScript(PDFJS+"pdf.min.js"); }
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const page=await pdf.getPage(1);
  const v0=page.getViewport({scale:1}); const vp=page.getViewport({scale:Math.min(4,2600/Math.max(v0.width,v0.height))});
  const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise; return await canvasBlob(c,"image/png");
}
async function getAssets(){ if(assetsNs===undefined){ try{ assetsNs = window.claude?.use ? await window.claude.use("assets") : null; }catch(e){ assetsNs=null; } } return assetsNs; }
async function handlePlanFile(file){
  const s=site(), f=floor(); if(!s||!f||!file||readOnly) return;
  toast("Preparing floor plan…");
  try{
    let blob=file, type=file.type;
    if(type==="application/pdf"||/\.pdf$/i.test(file.name)){ blob=await pdfToBlob(file); type="image/png"; }
    if(!/^image\/(png|jpeg|gif|webp|svg\+xml)$/.test(type)) return toast("Use a PNG, JPG, WebP, SVG or PDF floor plan.");
    const url=URL.createObjectURL(blob); const img=await loadImg(url);
    let w=img.naturalWidth||1600, h=img.naturalHeight||1000;
    const old=f.plan;
    if(type!=="image/svg+xml" && (blob.size>15e6 || Math.max(w,h)>6000)){ const c=drawTo(img,4000); blob=await canvasBlob(c,"image/jpeg",.85); type="image/jpeg"; }
    f.plan=await storePlanImage(s,f,blob,type,w,h);
    URL.revokeObjectURL(url);
    persist("sites",s.id); render(); toast("Floor plan added. Use Rotate / crop to straighten or trim it.");
    if(old) dropPlanStorage(old);
  }catch(e){
    const c=e?.code;
    toast(c==="too_large"?"That file is too large. Use one under 20 MB.":c==="unsupported_type"?"That file type isn't supported. Use PNG, JPG, SVG or PDF.":c==="quota_or_state"?"Floor plan storage is full. Remove an old plan first.":c==="pdf_load"?"Couldn't load the PDF reader. Try a PNG or JPG export instead.":c==="bad_image"?"That image couldn't be read. Try another file.":"Couldn't add the floor plan. Try again, or use a PNG or JPG.");
  }
}

  L(sw,40,srv,0,"C-200","green","2 m"); L(sw,41,srv,1,"C-201","green","2 m"); L(sw,42,nas,0,"C-210","green","2 m"); L(sw,46,ups,0,"C-220","grey","3 m");
  Object.assign(srv.ports[4],{label:"iDRAC",ip:"10.0.10.111"}); sw.ports[0].vlan="20";
  const S2={id:uid(),name:"Head Office (sample)",address:"123 Example Street\nSample City",contact:"",notes:"Sample site. Replace with your own.",floors:[{id:uid(),name:"Ground floor",plan:null}],pins:[]};
  R.siteId=S2.id; const fl=S2.floors[0].id;
  const J=(label,x,y,room,port,endpoint,eip)=>S2.pins.push({id:uid(),kind:"jack",floor:fl,x:x/1600,y:y/1000,label,room,ports:[{link:port==null?null:{r:R.id,d:pp.id,p:port},cable:"W-"+label,endpoint:endpoint||"",eip:eip||"",mac:""}],note:""});
  J("1-01",120,60,"Reception",0,"Reception PC","10.0.20.21"); J("1-02",380,60,"Reception",1,"Reception phone","10.0.30.11"); J("1-03",480,200,"Open office",2,"Desk 3 PC","10.0.20.33");
  J("1-04",700,580,"Open office",3,"Printer","10.0.20.50"); J("1-05",60,470,"Office 101",4); J("1-06",1140,450,"Meeting room",5,"Meeting room display","10.0.20.60"); J("1-07",620,940,"Office 103",null);
  S2.pins.push({id:uid(),kind:"rack",floor:fl,x:1360/1600,y:170/1000,label:"",room:"Server room",rack:R.id});
  S.sites[S2.id]=S2; S.racks[R.id]=R; curSite=S2.id; curFloor=fl; curId=R.id; view="site";
  try{ S2.floors[0].plan=await storePlanImage(S2,S2.floors[0],new Blob([SAMPLE_PLAN],{type:"image/svg+xml"}),"image/svg+xml",1600,1000); }catch(e){}
  persist("sites",S2.id); persist("racks",R.id); render(); toast("Sample data loaded. Delete the sample site when you're ready to add your own.");
}

/* ---------- custom device setup ---------- */
function afterAdd(d){ if(d.type==="custom") openCustomSetup(d.id,true); }
function openCustomSetup(id,isNew){
  const r=rack(), d=devById(r,id); if(!d) return;
  const k={rj45:0,sfp:0,lc:0}; d.ports.forEach(p=>k[p.kind]++);
  $("#modalRoot").innerHTML=`<div class="veil" id="veil"><div class="modal" role="dialog" aria-label="Custom device">
   <h2>${isNew?"Add a custom device":"Custom device setup"}</h2><p class="hint">For anything not in the library: a KVM, media converter, NVR, phone system, camera recorder…</p>
   <div class="fields" id="cxf">
     <label>Name<input id="cx_name" value="${esc(d.name)}"></label>
     <label>What is it<input id="cx_kind" value="${esc(d.kind||"")}" placeholder="e.g. KVM switch"></label>
     <label>Model<input id="cx_model" value="${esc(d.model||"")}" placeholder="optional"></label>
     <label>Height (U)<input id="cx_h" type="number" min="1" max="20" value="${d.h}"></label>
     <label>RJ45 ports<input id="cx_rj45" type="number" min="0" max="200" value="${k.rj45}"></label>
     <label>SFP ports<input id="cx_sfp" type="number" min="0" max="200" value="${k.sfp}"></label>
     <label>Fiber LC ports<input id="cx_lc" type="number" min="0" max="200" value="${k.lc}"></label>
     <label>Management IP<input id="cx_ip" class="mono" value="${esc(d.ip||"")}" placeholder="optional"></label>
   </div>
   <div class="cx-preview" id="cxPrev"></div>
   <div class="btnrow" style="justify-content:flex-end"><button class="btn" id="cxCancel">${isNew?"Cancel":"Close"}</button><button class="btn primary" id="cxSave">${isNew?"Add to rack":"Save"}</button></div></div></div>`;
  const prev=()=>{ const h=Math.max(1,Math.min(20,parseInt($("#cx_h").value)||1)), n=["rj45","sfp","lc"].reduce((a,x)=>a+Math.max(0,parseInt($("#cx_"+x).value)||0),0);
    $("#cxPrev").textContent=`${h}U · ${n} port${n===1?"":"s"}${n?` · laid out in ${n>12?(n/2>24&&h>=2?4:2):1} row${n>12?"s":""}`:""}`; };
  $("#cxf").addEventListener("input",prev); prev();
  $("#cxCancel").onclick=()=>{ if(isNew){ r.devices=r.devices.filter(x=>x.id!==id); sel={dev:null,port:null,slot:null,pin:null}; saveRack(); } closeModal(); };
  $("#cxSave").onclick=()=>{
    const h=Math.max(1,Math.min(20,parseInt($("#cx_h").value)||1));
    let u=d.u; if(!fits(r,u,h,d.id)){ const top=d.u+d.h-1; if(fits(r,top-h+1,h,d.id)) u=top-h+1; else { const f=(()=>{ for(let t=r.units;t>=h;t--){ const uu=t-h+1; if(fits(r,uu,h,d.id)) return uu; } return null; })(); if(f==null) return toast(`There's no ${h}U gap in this rack.`); u=f; } }
    d.u=u; d.h=h; d.name=$("#cx_name").value.trim()||d.name; d.kind=$("#cx_kind").value.trim(); d.model=$("#cx_model").value.trim(); d.ip=$("#cx_ip").value.trim();
    setPortCounts(r,d,{rj45:Math.max(0,parseInt($("#cx_rj45").value)||0),sfp:Math.max(0,parseInt($("#cx_sfp").value)||0),lc:Math.max(0,parseInt($("#cx_lc").value)||0)});
    closeModal(); sel={dev:d.id,port:null,slot:null,pin:null}; saveRack(); toast(`${d.name} ${isNew?"added":"updated"} at U${d.u}${d.h>1?"–"+(d.u+d.h-1):""}.`); };
  setTimeout(()=>$("#cx_kind")?.focus(),0);
}

/* ---------- import ---------- */
function openImport(){
  $("#modalRoot").innerHTML=`<div class="veil" id="veil"><div class="modal" role="dialog" aria-label="Import">
   <h2>Import</h2><p class="hint">Load a RackGrid backup (.json) to add its sites and racks, or a device list (.csv) to add devices to <b>${esc(rack()?.name||"a new rack")}</b>.</p>
   <div class="fields"><label class="full">File<input type="file" id="impFile" accept=".json,.csv,.txt"></label></div>
   <p class="sech">Or paste</p><textarea id="impText" placeholder="Paste JSON or CSV here"></textarea>
   <p class="sech" style="margin-top:12px">CSV columns</p>
   <pre>name,type,u,height,ip,model,serial,rj45,sfp,lc
SW01,switch,40,1,10.0.0.2,Cisco C9200-24T,FOC1234,24,4,0
SRV01,server,30,2,10.0.10.11,Dell R650,,4,0,0</pre>
   <p class="hint">Type is one of: ${Object.keys(TYPES).join(", ")}. Leave <b>u</b> blank to use the first free slot.</p>
   <div class="btnrow" style="justify-content:flex-end"><button class="btn" id="impCancel">Cancel</button><button class="btn primary" id="impGo">Import</button></div></div></div>`;
  $("#impCancel").onclick=closeModal; $("#veil").onclick=e=>{ if(e.target.id==="veil") closeModal(); };
  $("#impGo").onclick=()=>doImport($("#impText").value);
}
function closeModal(){ $("#modalRoot").innerHTML=""; }
function readImportFile(inp){ const f=inp.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ $("#impText").value=fr.result; }; fr.readAsText(f); }
function parseCSV(text){ const rows=[]; let row=[],cell="",qd=false; for(let i=0;i<text.length;i++){ const c=text[i];
  if(qd){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else qd=false; } else cell+=c; }
  else if(c==='"') qd=true; else if(c===","){ row.push(cell); cell=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); } return rows.filter(r=>r.some(x=>x.trim())); }
function normRack(r){ const id=uid(); const map={};
  const out={id,siteId:r.siteId||"",name:String(r.name||"Imported rack"),location:String(r.location||""),units:Math.max(1,Math.min(60,+r.units||42)),notes:String(r.notes||""),devices:[]};
  for(const d of (r.devices||[])){ const nid=uid(); map[d.id]=nid; out.devices.push({id:nid,name:String(d.name||"DEV"),type:TYPES[d.type]?d.type:"blank",u:+d.u||1,h:Math.max(1,+d.h||1),model:d.model||"",serial:d.serial||"",ip:d.ip||"",notes:d.notes||"",ports:(d.ports||[]).map((p,i)=>({n:+p.n||i+1,kind:["rj45","sfp","lc"].includes(p.kind)?p.kind:"rj45",label:p.label||"",ip:p.ip||"",vlan:p.vlan||"",mac:p.mac||"",link:p.link||null,ext:p.ext||"",cable:p.cable||"",color:p.color||"",len:p.len||"",note:p.note||""}))}); }
  for(const d of out.devices) for(const p of d.ports) if(p.link) p.link = map[p.link.d] ? {d:map[p.link.d],p:+p.link.p} : null;
  return {rack:out,map}; }
function doImport(text){
  text=(text||"").trim(); if(!text) return toast("Choose a file or paste something to import.");
  if(text[0]==="{"||text[0]==="["){
    let data; try{ data=JSON.parse(text); }catch(e){ return toast("That JSON couldn't be read. Check it's a RackGrid backup."); }
    const rlist = Array.isArray(data) ? data : data.racks ? (Array.isArray(data.racks)?data.racks:Object.values(data.racks)) : (data.devices?[data]:[]);
    const slist = Array.isArray(data.sites) ? data.sites : data.sites ? Object.values(data.sites) : [];
    const rackMap={}, devMaps={}, siteMap={};
    for(const s of slist){ if(!s||typeof s!=="object") continue; const ns=clone(s); ns.id=uid(); siteMap[s.id]=ns.id; ns.name=ns.name||"Imported site"; ns.floors=(ns.floors||[]).map(f=>({id:f.id||uid(),name:f.name||"Floor",plan:f.plan&&f.plan.asset&&IN_CLAUDE?f.plan:null,_img:f.plan?.image&&data.images?.[f.plan.image]?{data:data.images[f.plan.image],w:f.plan.w,h:f.plan.h,rot:f.plan.rot,crop:f.plan.crop}:null})); if(!ns.floors.length) ns.floors=[{id:uid(),name:"Ground floor",plan:null}]; ns.pins=ns.pins||[]; S.sites[ns.id]=ns; }
    let added=0; for(const r of rlist){ if(!r||typeof r!=="object") continue; const {rack:nr,map}=normRack(r); rackMap[r.id]=nr.id; devMaps[r.id]=map;
      nr.siteId = siteMap[r.siteId] || (S.sites[r.siteId]?r.siteId:"") || curSite || ""; S.racks[nr.id]=nr; persist("racks",nr.id); curId=nr.id; added++; }
    for(const s of slist){ const ns=S.sites[siteMap[s.id]]; if(!ns) continue; const pinMap={}; for(const p of ns.pins){ const nid=uid(); pinMap[p.id]=nid; p.id=nid; } for(const p of ns.pins){ if(p.kind==="ap"&&p.up){ if(p.up.pin) p.up = pinMap[p.up.pin] ? {pin:pinMap[p.up.pin],j:p.up.j} : null; else if(p.up.r){ const nr=rackMap[p.up.r], nd=devMaps[p.up.r]?.[p.up.d]; p.up = nr&&nd ? {r:nr,d:nd,p:p.up.p} : null; } } for(const x of jp(p)) if(x.link){ const nr=rackMap[x.link.r], nd=devMaps[x.link.r]?.[x.link.d]; x.link = nr&&nd ? {r:nr,d:nd,p:x.link.p} : null; } if(p.rack) p.rack=rackMap[p.rack]||""; } persist("sites",ns.id); }
    if(slist.length){ curSite=siteMap[slist[0].id]; curFloor=null; }
    // restore floor plan images included in the backup
    (async()=>{ let ok=0; for(const id of Object.values(siteMap)){ const ns=S.sites[id]; if(!ns) continue; let changed=false;
      for(const f of ns.floors){ const im=f._img; delete f._img; if(!im) continue; changed=true;
        try{ const blob=await (await fetch(im.data)).blob(); const pl=await storePlanImage(ns,f,blob,blob.type||"image/png",im.w,im.h); f.plan={...pl,rot:im.rot||0,...(im.crop?{crop:im.crop}:{})}; ok++; }catch(e){} }
      if(changed){ persist("sites",id); } }
      if(ok){ render(); toast(`Restored ${ok} floor plan${ok===1?"":"s"}.`); } })();
    closeModal(); sel={dev:null,port:null,slot:null,pin:null}; pickDefaults(); render();
    return toast(`Imported ${slist.length?`${slist.length} site${slist.length===1?"":"s"} and `:""}${added} rack${added===1?"":"s"}.`);
  }
  const rows=parseCSV(text); if(rows.length<2) return toast("The CSV needs a header row and at least one device.");
  const head=rows[0].map(h=>h.trim().toLowerCase()); const col=n=>head.indexOf(n);
  if(col("name")<0) return toast("The CSV needs a 'name' column.");
  let r=rack(); if(!r){ if(!site()) createSite(); createRack(); r=rack(); }
  let added=0, skipped=[];
  for(const row of rows.slice(1)){ const g=k=>col(k)>=0?(row[col(k)]||"").trim():"";
    const type=TYPES[g("type").toLowerCase()]?g("type").toLowerCase():"server"; const t=TYPES[type];
    const h=Math.max(1,parseInt(g("height"))||t.h); let u=parseInt(g("u"));
    if(!u||!fits(r,u,h)) u=firstFree(r,h); if(u==null){ skipped.push(g("name")); continue; }
    const spec=(g("rj45")||g("sfp")||g("lc")) ? [["rj45",+g("rj45")||0],["sfp",+g("sfp")||0],["lc",+g("lc")||0]] : t.ports;
    r.devices.push({id:uid(),name:g("name")||nextName(r,type),type,u,h,model:g("model"),serial:g("serial"),ip:g("ip"),notes:g("notes"),ports:makePorts(spec)}); added++; }
  closeModal(); view="rack"; saveRack(); toast(`Added ${added} device${added===1?"":"s"}${skipped.length?`. No room for: ${skipped.join(", ")}`:""}.`);
}

/* ---------- export ---------- */
async function offer(filename,data){
  let dl=null; try{ dl = window.claude?.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){ try{ await dl.save({filename,data}); toast("Saved "+filename+"."); return; }
    catch(e){ if(e?.code==="declined") return; if(e?.code==="rate_limited") return toast("A save is already open. Finish it first."); } }
  if(!IN_CLAUDE){ const type=filename.endsWith(".csv")?"text/csv":"application/json"; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast("Downloaded "+filename+"."); return; }
  $("#modalRoot").innerHTML=`<div class="veil" id="veil"><div class="modal"><h2>${esc(filename)}</h2><p class="hint">Downloads aren't available here. Copy this text and save it as <b>${esc(filename)}</b>.</p><textarea id="expText" readonly>${esc(data)}</textarea><div class="btnrow" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="cp">Copy</button><button class="btn primary" id="cl">Done</button></div></div></div>`;
  $("#cl").onclick=closeModal; $("#cp").onclick=()=>{ const ta=$("#expText"); if(navigator.clipboard) navigator.clipboard.writeText(data).then(()=>toast("Copied."),()=>{ ta.select(); toast("Press Ctrl+C to copy."); }); else ta.select(); };
}
async function exportJson(){ if(!Object.keys(S.sites).length && !Object.keys(S.racks).length) return toast("There's nothing to back up yet.");
  toast("Preparing backup…");
  const sites=clone(Object.values(S.sites)), images={}; let n=0, missed=0;
  for(const s of sites) for(const f of s.floors||[]) if(f.plan){
    try{ const b=await planBlob(f.plan); const ref="img"+(++n); images[ref]=await blobToDataURL(b); f.plan={w:f.plan.w,h:f.plan.h,rot:f.plan.rot||0,crop:f.plan.crop||null,image:ref}; }
    catch(e){ missed++; } }
  await offer(`rackgrid-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({app:"rackgrid",version:3,exported:new Date().toISOString(),sites,racks:Object.values(S.racks),images}));
  if(missed) toast(`${missed} floor plan image${missed===1?"":"s"} couldn't be included in the backup.`); }
function exportCsv(){ const r=rack(); const s=site(); if(!r&&!s) return toast("Select a site or rack first.");
  const c=v=>`"${String(v??"").replace(/"/g,'""')}"`; const lines=[["section","from","to","cable_id","color","length","ip","vlan","mac"].join(",")];
  if(r){ for(const x of cableRows(r)) lines.push(["cable",x.a,x.b,x.cable,x.color,x.len,"","",""].map(c).join(","));
    for(const x of ipRows(r)) lines.push(["ip",x.what,"","","","",x.ip,x.vlan,x.mac].map(c).join(",")); }
  if(s) for(const p of (s.pins||[]).filter(p=>p.kind==="jack")) jp(p).forEach((x,j)=>{ const t=trace(p,j); lines.push(["wall_port",`Wall port ${jname(p,j)} · ${floorName(s,p.floor)}${p.room?" · "+p.room:""}${x.endpoint?" · "+x.endpoint:""}`,t?`${portName(t.d,t.pi)}${t.o?" → "+portName(t.o,t.oi):""}`:"",x.cable||"","","",x.eip||"",t?.op?.vlan||"",x.mac||""].map(c).join(",")); });
  if(s) for(const a of (s.pins||[]).filter(p=>p.kind==="ap")){ const at=apTrace(s,a), sw=apSwitch(s,a); lines.push(["access_point",`Access point ${a.label} · ${floorName(s,a.floor)}${a.room?" · "+a.room:""}${a.model?" · "+a.model:""}`,`${at?.jack?"Wall port "+jname(at.jack,at.j):at?.direct?"Direct":""}${sw?" → "+portName(sw.d,sw.pi):""}`,"","","",a.ip||"",sw?.pt?.vlan||"",a.mac||""].map(c).join(",")); }
  offer(`${(r?.name||s.name).replace(/[^\w-]+/g,"_")}-cables-ips.csv`, lines.join("\n")); }

let tt; function toast(m){ let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,3400); }

render(); boot();
})();
</script>
