function diffRack(a,b){
  const out=[], nm=x=>x?.name||"rack";
  if(!a&&b) return [`created rack ${nm(b)}`]; if(a&&!b) return [`deleted rack ${nm(a)}`]; if(!a||!b) return out;
  if(a.name!==b.name) out.push(`renamed rack ${a.name} to ${b.name}`);
  const shift=b.units-a.units, both=b.devices.filter(d=>a.devices.some(x=>x.id===d.id)), bottomGrow=shift!==0&&both.length>0&&both.every(d=>a.devices.find(x=>x.id===d.id).u+shift===d.u);
  if(a.units!==b.units) out.push(bottomGrow?`${shift>0?"added":"removed"} ${Math.abs(shift)}U at the bottom of ${b.name} (now ${b.units}U)`:`changed ${b.name} to ${b.units}U`);
  if((a.kind||"cabinet")!==(b.kind||"cabinet")) out.push(`changed ${b.name} to a ${rkind(b).short.toLowerCase()}`);
  if((a.numbering||"bottom")!==(b.numbering||"bottom")||(a.width||"19")!==(b.width||"19")||(a.depth||"")!==(b.depth||"")) out.push(`updated the specs of rack ${b.name}`);
  if((a.siteId||"")!==(b.siteId||"")) out.push(`moved rack ${b.name} to ${S.sites[b.siteId]?.name||"another site"}`);
  if((a.location||"")!==(b.location||"")||(a.notes||"")!==(b.notes||"")) out.push(`updated details of rack ${b.name}`);
  const am=new Map(a.devices.map(d=>[d.id,d])), bm=new Map(b.devices.map(d=>[d.id,d]));
  const U=d=>uSpan(b,d.u,d.h);
  for(const d of b.devices) if(!am.has(d.id)) out.push(`added ${(TYPES[d.type]?.label||"device").replace("…","")} ${d.name} at ${U(d)} in ${b.name}`);
  for(const d of a.devices) if(!bm.has(d.id)) out.push(`removed ${d.name} from ${b.name}`);
  const seen=new Set();
  for(const d of b.devices){ const o=am.get(d.id); if(!o) continue;
    if(o.name!==d.name) out.push(`renamed ${o.name} to ${d.name}`);
    if(o.u!==d.u&&!(bottomGrow&&o.u+shift===d.u)) out.push(`moved ${d.name} from ${uSpan(a,o.u,o.h)} to ${U(d)}`); else if(o.h!==d.h) out.push(`resized ${d.name} to ${d.h}U`);
    const f=["model","serial","ip","notes","type","kind","installed","replaceBy"].filter(k=>(o[k]||"")!==(d[k]||""));
    if(f.length) out.push(`updated ${d.name} (${f.map(k=>({ip:"IP",replaceBy:"battery date",installed:"battery date",kind:"kind"}[k]||k)).filter((x,i,arr)=>arr.indexOf(x)===i).join(", ")})`);
    if(o.ports.length!==d.ports.length) out.push(`changed ${d.name} to ${d.ports.length} ports`);
    if((o.itg?.id||"")!==(d.itg?.id||"")) out.push(d.itg?`linked ${d.name} to IT Glue ${d.itg.name||""}`.trim():`unlinked ${d.name} from IT Glue`);
    d.ports.forEach((p,i)=>{ const q=o.ports[i]; if(!q) return;
      const lk=x=>x.link?(x.link.r&&x.link.r!==b.id?x.link.r+"/":"")+x.link.d+":"+x.link.p:"";
      const xr=x=>x.link?.r&&x.link.r!==b.id, mine=x=>!xr(x)||b.id<x.link.r, pn=x=>{ const pe=peer(b,x); return pe?peerName(b,pe):"another port"; };
      if(lk(p)!==lk(q)||(p.ext||"")!==(q.ext||"")){ const key=[d.id+":"+i,p.link?lk(p):"",q.link?lk(q):""].sort().join("|"); if(seen.has(key)) return; seen.add(key);
        if(p.link&&xr(p)){ if(mine(p)) out.push(`connected ${portName(d,i)} to ${pn(p)}`); else if(q.link&&!xr(q)){ const op=am.get(q.link.d); out.push(`disconnected ${portName(d,i)}${op?" from "+portName(op,q.link.p):""}`); } }
        else if(p.link){ const peer=bm.get(p.link.d); seen.add([p.link.d+":"+p.link.p,d.id+":"+i,""].sort().join("|")); out.push(`connected ${portName(d,i)} to ${peer?portName(peer,p.link.p):"another port"}`); }
        else if(p.ext) out.push(`connected ${portName(d,i)} to ${p.ext}`);
        else if(q.link&&xr(q)){ if(mine(q)){ const qr=S.racks[q.link.r], od=devById(qr,q.link.d); out.push(`disconnected ${portName(d,i)}${od?" from "+qr.name+" · "+portName(od,q.link.p):""}`); } }
        else { const op=q.link?am.get(q.link.d):null; out.push(`disconnected ${portName(d,i)}${op?" from "+portName(op,q.link.p):""}`); } return; }
      const f2=["label","ip","vlan","mac","cable","color","len","note"].filter(k=>(p[k]||"")!==(q[k]||""));
      if(f2.length && !(f2.every(k=>["cable","color","len"].includes(k)) && p.link && (xr(p)?!mine(p):p.link.d<d.id))) out.push(`updated ${portName(d,i)} (${f2.map(k=>k==="ip"?"IP":k==="vlan"?"VLAN":k==="mac"?"MAC":k==="len"?"length":k==="cable"?"cable ID":k).join(", ")})`);
    }); }
  return out;
}
function diffSite(a,b){
  const out=[]; if(!a&&b) return [`created site ${b.name}`]; if(a&&!b) return [`deleted site ${a.name}`]; if(!a||!b) return out;
  if(a.name!==b.name) out.push(`renamed site ${a.name} to ${b.name}`);
  const f=["address","contact","notes"].filter(k=>(a[k]||"")!==(b[k]||"")); if(f.length) out.push(`updated ${b.name} ${f.join(", ")}`);
  const af=new Map((a.floors||[]).map(x=>[x.id,x])), bf=new Map((b.floors||[]).map(x=>[x.id,x]));
  for(const x of b.floors||[]){ const o=af.get(x.id); if(!o){ out.push(`added floor ${x.name}`); continue; }
    if(o.name!==x.name) out.push(`renamed floor ${o.name} to ${x.name}`);
    const pid=p=>p?(p.sb||p.local||p.asset||p.inline||""):"";
    if(pid(o.plan)!==pid(x.plan)) out.push(x.plan?(o.plan?`replaced the floor plan of ${x.name}`:`uploaded a floor plan for ${x.name}`):`removed the floor plan of ${x.name}`);
    else if(x.plan&&o.plan&&!same({r:o.plan.rot,c:o.plan.crop},{r:x.plan.rot,c:x.plan.crop})) out.push(`rotated or cropped the floor plan of ${x.name}`); }
  for(const x of a.floors||[]) if(!bf.has(x.id)) out.push(`deleted floor ${x.name}`);
  const kindName=p=>p.kind==="dev"?`${devCat(p).label.toLowerCase()} ${p.label}`:p.kind==="ap"?`access point ${p.label}`:p.kind==="rack"?`rack location ${S.racks[p.rack]?.name||p.label||""}`.trim():`wall port ${p.label}`;
  const ap=new Map((a.pins||[]).map(x=>[x.id,x])), bp=new Map((b.pins||[]).map(x=>[x.id,x]));
  for(const p of b.pins||[]){ const o=ap.get(p.id); if(!o){ out.push(`added ${kindName(p)}${p.floor?" on "+floorName(b,p.floor):""}`); continue; }
    if(o.label!==p.label&&p.kind!=="rack") out.push(`renamed ${kindName(o)} to ${p.label}`);
    if(Math.abs((o.x||0)-(p.x||0))>1e-4||Math.abs((o.y||0)-(p.y||0))>1e-4||o.floor!==p.floor) out.push(`moved ${kindName(p)}`);
    if(p.kind==="jack"){ const oj=jp(clone(o)), pj=jp(clone(p));
      if(oj.length!==pj.length) out.push(`changed ${kindName(p)} to ${pj.length} port${pj.length===1?"":"s"}`);
      pj.forEach((x,j)=>{ const y=oj[j]; if(!y) return; const nm=pj.length>1?`${p.label} ${letter(j)}`:p.label;
        if(!same(x.link,y.link)){ const r=S.racks[x.link?.r], d=devById(r,x.link?.d); out.push(x.link&&x.link.p!=null&&d?`patched wall port ${nm} to ${portName(d,x.link.p)}`:x.link?`started patching wall port ${nm}`:`unpatched wall port ${nm}`); }
        const ff=["endpoint","eip","mac","cable"].filter(k=>(x[k]||"")!==(y[k]||"")); if(ff.length) out.push(`updated wall port ${nm} (${ff.map(k=>({endpoint:"device",eip:"device IP",mac:"MAC",cable:"cable ID"}[k])).join(", ")})`); }); }
    else if(hasUp(p)){ if(!same(o.up,p.up)) out.push(p.up?`connected ${kindName(p)}`:`disconnected ${kindName(p)}`);
      const ff=["model","ip","mac","ssids","band","poe","room","note","range"].filter(k=>(o[k]??"")!==(p[k]??"")); if(ff.length) out.push(`updated ${kindName(p)} (${ff.map(k=>k==="ip"?"IP":k==="mac"?"MAC":k==="ssids"?"SSIDs":k==="poe"?"power":k==="range"?"coverage":k).join(", ")})`); }
    else if(o.rack!==p.rack) out.push(`changed ${kindName(p)}`);
    if(p.kind==="jack"&&((o.room||"")!==(p.room||"")||(o.note||"")!==(p.note||""))) out.push(`updated ${kindName(p)} details`); }
  for(const p of a.pins||[]) if(!bp.has(p.id)) out.push(`removed ${kindName(p)}`);
  return out;
}

  const nS=Object.keys(sites).length, nR=Object.keys(racks).length; if(!nS&&!nR) return toast("Your Personal Workspace is empty.");
  toast("Copying your Personal Workspace into the team…");
  const ss=clone(Object.values(sites)), images={}; let n=0;

      if(b){ const ref="img"+(++n); images[ref]=await blobToDataURL(b); f.plan={w:f.plan.w,h:f.plan.h,rot:f.plan.rot||0,crop:f.plan.crop||null,image:ref}; } else f.plan=null; }catch(e){ f.plan=null; } }
  doImport(JSON.stringify({app:"rackgrid",version:3,sites:ss,racks:Object.values(racks),images}));

/* =====================================================================
   IT Glue: retrieve devices and locations
   Team Workspace → live, through the team's read-only "itglue" bridge function.
   Any workspace   → from a CSV export of IT Glue configurations.
   ===================================================================== */
const ITG_REGIONS=[["us","United States (itglue.com)"],["eu","Europe (eu.itglue.com)"],["au","Australia (au.itglue.com)"]];
const ITG_NOT_RACK=/workstation|laptop|desktop|notebook|printer|phone|mobile|tablet|virtual|\bvm\b|monitor|camera|licen|software|user|thin client|kiosk|copier|scanner/i;
// configurations that live out on the floor rather than in a rack
function itgFloorCat(type){ const t=(type||"").toLowerCase();
  if(/virtual|\bvm\b|software|licen|\buser\b|mobile|tablet|cell/.test(t)) return null;
  if(/printer|copier|scanner|\bmfp\b|multifunction|plotter/.test(t)) return "printer";
  if(/workstation|laptop|desktop|notebook|thin client|kiosk|\bpc\b|computer/.test(t)) return "pc";
  if(/phone|voip|handset|intercom/.test(t)) return "phone";
  if(/camera|cctv/.test(t)) return "camera";
  if(/display|\btv\b|television|projector|signage|monitor/.test(t)) return "display";
  if(/access control|door|badge|card reader/.test(t)) return "access";
  if(/\biot\b|sensor|thermostat|controller/.test(t)) return "iot";
  return null; }
function itgKind(type,model){
  const t=(type||"").toLowerCase(), m=(model||"").toLowerCase();
  if(/access point|wireless|\bwap\b|\bap\b|wi-?fi/.test(t)) return "ap";
  if(itgFloorCat(type)) return "floor";
  if(/patch/.test(t)) return /fib|fibre|fiber/.test(t)?"fiber":(/48/.test(m)?"patch48":"patch");
  if(/firewall|utm|security appliance/.test(t)) return "firewall";
  if(/router|gateway|sd-?wan/.test(t)) return "router";
  if(/switch/.test(t)) return /\b48|48[a-z]|-48/.test(m)?"switch48":"switch";
  if(/battery/.test(t)) return "battery";
  if(/\bups\b|uninterrupt/.test(t)) return "ups";
  if(/pdu|power distribution/.test(t)) return "pdu";
  if(/nas|san\b|storage/.test(t)) return "nas";
  if(/server|host|hypervisor|esx|appliance/.test(t)) return "server";
  return "custom";
}
function itgModel(c){ const mf=(c.manufacturer||"").trim(), md=(c.model||"").trim(); if(!md) return mf; if(!mf||md.toLowerCase().startsWith(mf.toLowerCase())) return md; return mf+" "+md; }
function itgMeta(c,prev){
  const m={id:c.id||"",name:c.name||"",url:c.url||"",org:c.org||"",orgId:c.orgId||"",type:c.type||"",status:c.status||"",hostname:c.hostname||"",mac:c.mac||"",
    assetTag:c.assetTag||"",os:c.os||"",location:c.location||"",warranty:c.warranty||"",syncedAt:new Date().toISOString(),source:c._csv?"csv":"api"};
  if(Array.isArray(c.interfaces)) m.interfaces=c.interfaces.slice(0,64).map(x=>({name:x.name||"",ip:x.ip||"",mac:x.mac||"",primary:!!x.primary}));
  else if(prev?.interfaces) m.interfaces=prev.interfaces;
  return m;
}
// Copies IT Glue values onto a device. Never blanks a field IT Glue leaves empty, and keeps the RackGrid name unless asked.
function applyItg(d,c,{useName=false}={}){
  const before={name:d.name,model:d.model,serial:d.serial,ip:d.ip};
  const model=itgModel(c); if(model) d.model=model;
  if(c.serial) d.serial=c.serial; if(c.ip) d.ip=c.ip;
  if(useName&&c.name) d.name=c.name;
  d.itg=itgMeta(c,d.itg);
  return Object.keys(before).filter(k=>before[k]!==d[k]);
}
function itgLinked(){ const m={}; for(const r of Object.values(S.racks)) for(const d of r.devices) if(d.itg?.id) m[d.itg.id]={where:r.name,name:d.name};
  for(const s of Object.values(S.sites)) for(const p of s.pins||[]) if(hasUp(p)&&p.itg?.id) m[p.itg.id]={where:s.name,name:p.label}; return m; }
const itgReady=()=>mode==="team"&&!!Team.itg?.configured;
const pDate=w=>{ const m=String(w||"").match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T00:00:00(?:\.0+)?(?:Z|[+-]00:?00)?$)/); return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(w); }; // date-only values are calendar days, not UTC instants
const warrantyPast=w=>{ if(!w) return false; const t=pDate(w); if(isNaN(t)) return false; const d=new Date(); d.setHours(0,0,0,0); return t<d; };
const fmtDate=w=>{ const t=pDate(w); return w&&!isNaN(t)?t.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):(w||""); };

async function itgCall(action,params={}){
  if(mode!=="team") throw new Error("Live IT Glue lookups work in a Team Workspace. Use a CSV export instead.");
  if(!Team.online) throw new Error("You're offline. IT Glue lookups need a connection.");
  const {data,error}=await sb().functions.invoke("itglue",{body:{team:Team.id,action,...params}});
  if(error){ let msg=""; try{ msg=(await error.context?.json())?.error||""; }catch(e){}
    if(!msg) msg = /Fetch|Relay|non-2xx/.test(error.name+error.message) ? "Couldn't reach the IT Glue bridge. Check you're online and that the itglue function is deployed (see SETUP.md)." : errText(error);
    throw new Error(msg); }
  if(data?.error) throw new Error(data.error);
  return data;
}
const itgCache={orgs:null,cfg:{},loc:{}};
async function itgOrgs(force){ if(!itgCache.orgs||force) itgCache.orgs=(await itgCall("organizations")).items; return itgCache.orgs; }
async function itgConfigs(org,force){ if(!itgCache.cfg[org]||force){ const r=await itgCall("configurations",{org}); itgCache.cfg[org]={items:r.items,truncated:r.truncated,at:Date.now()}; } return itgCache.cfg[org]; }

/* ---------- CSV export → configuration rows ---------- */
const ITG_COLS=[["name","Name",["name","configuration name","configuration"]],["type","Type",["configuration type","configuration type name","type","kind"]],
  ["manufacturer","Manufacturer",["manufacturer","manufacturer name","make","vendor"]],["model","Model",["model","model name"]],
  ["serial","Serial number",["serial number","serial","serial no","sn"]],["ip","Primary IP",["primary ip","primary ip address","ip address","ip"]],
  ["hostname","Hostname",["hostname","host name"]],["mac","MAC address",["mac address","primary mac","mac"]],["assetTag","Asset tag",["asset tag","asset"]],
  ["os","Operating system",["operating system","operating system name","os"]],["location","Location",["location","location name","site"]],
  ["status","Status",["configuration status","configuration status name","status"]],["warranty","Warranty expires",["warranty expires at","warranty expires","warranty expiration","warranty expiry","warranty"]],
  ["org","Organization",["organization","organization name","client","company","customer"]],["url","IT Glue link",["resource url","url","link"]],["id","IT Glue ID",["id","configuration id","itglue id"]]];
const normH=h=>String(h||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function itgGuessMap(headers){ const nh=headers.map(normH), map={};
  for(const [k,,syn] of ITG_COLS){ let i=-1; for(const sname of syn){ i=nh.indexOf(sname); if(i>=0) break; } if(i<0) for(const sname of syn){ i=nh.findIndex(h=>h.startsWith(sname+" ")||h.endsWith(" "+sname)); if(i>=0&&sname.length>3) break; i=-1; } map[k]=i; }
  return map; }
function itgCsvRows(csv,map){ return csv.rows.map((row,n)=>{ const c={_csv:true}; for(const [k] of ITG_COLS){ const i=map[k]; c[k]=i>=0?String(row[i]??"").trim():""; }
  if(!/^[0-9]{1,15}$/.test(c.id)) c.id=c.id?("csv:"+c.id):""; c._key=c.id||("row"+n); c.archived=/^(true|yes|1|archived)$/i.test(row[csv.headers.findIndex(h=>normH(h)==="archived")]||""); return c; }).filter(c=>c.name&&!c.archived); }

    closeModal(); if(added){ curId=r.id; view="rack"; } else if(aps) view="site"; render();
    toast([added?`Added ${added} device${added===1?"":"s"} to ${r.name}.`:"", aps?`Placed ${aps} item${aps===1?"":"s"} on ${f.name}. Drag them into position.`:"",
      noRoom.length?`No free space for: ${noRoom.slice(0,4).join(", ")}${noRoom.length>4?"…":""}.`:"", skipped.length?`Skipped ${skipped.length}: ${(!s||!f)?"no floor to place them on":"no rack chosen"}.`:""].filter(Boolean).join(" "));
  },
};

/* ---------- refresh linked devices ---------- */
async function itgRefreshDevices(list){
  const r=rack(); if(!r||!list.length) return; let ok=0, gone=0, failed="";
  toast(`Refreshing ${list.length} device${list.length===1?"":"s"} from IT Glue…`);
  for(let i=0;i<list.length;i+=4) await Promise.all(list.slice(i,i+4).map(async d=>{
    try{ const c=await itgCall("configuration",{id:d.itg.id}); applyItg(d,c); ok++; }
    catch(e){ if(/wasn't found/.test(e.message)){ gone++; d.itg={...d.itg,missing:true}; } else failed=e.message; } }));
  saveRack();
  toast(failed&&!ok?failed:`Refreshed ${ok} device${ok===1?"":"s"} from IT Glue.${gone?` ${gone} no longer exist${gone===1?"s":""} in IT Glue.`:""}${failed?" "+failed:""}`);
}

/* ---------- device panel ---------- */
function itgDeviceBox(d){
  const g=d.itg, live=itgReady()&&g&&/^[0-9]+$/.test(g.id);
  if(!g){ return itgReady()&&!readOnly?`<div class="itgbox none"><span><b>IT Glue</b><small>Not linked</small></span><button class="btn" data-act="itglink">Link to IT Glue…</button></div>`:""; }
  const row=(k,v,cls="")=>v?`<dt>${k}</dt><dd class="${cls}">${v}</dd>`:"";
  return `<div class="itgbox"><div class="itg-head"><span class="itg-logo" aria-hidden="true">IT</span><span><b>${esc(g.name||"IT Glue")}</b><small>${esc([g.org,g.type,g.status].filter(Boolean).join(" · "))}</small></span></div>
    ${g.missing?`<div class="notice">This configuration wasn't found in IT Glue on the last refresh. It may have been archived or deleted.</div>`:""}
    <dl>${row("Hostname",esc(g.hostname),"mono")}${row("MAC",esc(g.mac),"mono")}${row("Asset tag",esc(g.assetTag))}${row("OS",esc(g.os))}${row("Location",esc(g.location))}
      ${row("Warranty",g.warranty?`${esc(fmtDate(g.warranty))}${warrantyPast(g.warranty)?' <span class="chip warn">Expired</span>':""}`:"")}
      ${row("Synced",`${esc(relTime(g.syncedAt))}${g.source==="csv"?" · from CSV":""}`)}</dl>
    ${g.interfaces?.length?`<details class="itg-if"><summary>${g.interfaces.length} interface${g.interfaces.length===1?"":"s"} in IT Glue</summary><table>${g.interfaces.map(x=>`<tr><td>${esc(x.name)}${x.primary?' <span class="chip">Primary</span>':""}</td><td class="mono">${esc(x.ip)}</td><td class="mono">${esc(x.mac)}</td></tr>`).join("")}</table></details>`:""}
    <div class="btnrow">${live&&!readOnly?`<button class="btn" data-act="itgrefresh">Refresh from IT Glue</button>`:""}${/^https:\/\//.test(g.url)?`<a class="btn" href="${esc(g.url)}" target="_blank" rel="noopener" style="text-decoration:none">Open in IT Glue ↗</a>`:""}${readOnly?"":`<button class="btn danger" data-act="itgunlink">Unlink</button>`}</div></div>`;
}

/* ---------- site address from an IT Glue location ---------- */
async function itgPickLocation(){
  const s=site(); if(!s) return;
  let org=Team.itg?.orgId||"", orgs=[];
  const draw=(items,err,loading)=>{ $("#modalRoot").innerHTML=`<div class="veil" id="veil"><div class="modal" role="dialog" aria-label="IT Glue locations">
    <div class="tp-head"><div><h2>Fill address from IT Glue</h2><p class="hint" style="margin:2px 0 0">Pick the IT Glue location for ${esc(s.name)}.</p></div><button class="btn" id="lcClose">Close</button></div>
    <div class="fields"><label class="full">Organization<select id="lcOrg"><option value="">Choose…</option>${orgs.map(o=>`<option value="${o.id}"${o.id===org?" selected":""}>${esc(o.name)}</option>`).join("")}</select></label></div>
    ${err?`<div class="notice">${esc(err)}</div>`:""}${loading?`<p class="hint">Loading…</p>`:""}
    ${items?(items.length?`<div class="ws-list">${items.map(l=>`<button class="ws-team" data-loc="${l.id}"><span><b>${esc(l.name)}${l.primary?" (primary)":""}</b><small>${esc([l.address1,l.address2,l.city,l.region,l.postal,l.country].filter(Boolean).join(", "))}</small></span><span class="ws-go">Use →</span></button>`).join("")}</div>`:`<p class="hint">This organization has no locations in IT Glue.</p>`):""}</div></div>`;
    $("#lcClose").onclick=closeModal; $("#veil").onclick=e=>{ if(e.target.id==="veil") closeModal(); };
    $("#lcOrg").onchange=e=>{ org=e.target.value; load(); };
    $("#modalRoot").querySelectorAll("[data-loc]").forEach(b=>b.onclick=()=>{ const l=items.find(x=>x.id===b.dataset.loc);
      s.address=[[l.address1,l.address2].filter(Boolean).join(", "),[l.city,l.region].filter(Boolean).join(", ")+(l.postal?" "+l.postal:""),l.country].map(x=>x.trim()).filter(Boolean).join("\n");
      if(l.phone&&!s.contact) s.contact=l.phone; s.itg={orgId:org,locationId:l.id,name:l.name}; closeModal(); saveSite(); toast(`Address filled from IT Glue location ${l.name}.`); }); };
  const load=async()=>{ if(!org){ draw(null); return; } draw(null,"",true); try{ const r=await itgCall("locations",{org}); draw(r.items); }catch(e){ draw(null,e.message); } };
  draw(null,"",true); try{ orgs=await itgOrgs(); }catch(e){ draw(null,e.message); return; } load();
}

/* ---------- team settings: connect IT Glue ---------- */
function itgTeamSection(){
  const g=Team.itg||{}, mgr=Team.can("manage");
  if(g.missing) return `<h3 class="sech" style="margin-top:18px">IT Glue</h3><p class="hint">${mgr?"Run the updated <code>supabase/schema.sql</code> in Supabase to enable IT Glue, then deploy the <code>itglue</code> function (see SETUP.md).":"IT Glue isn't set up in this team's database yet."}</p>`;
  return `<h3 class="sech" style="margin-top:18px">IT Glue</h3>
    <p class="itg-status">${g.configured?`<span class="chip ok">Connected</span> ${esc((ITG_REGIONS.find(r=>r[0]===g.region)||[,""])[1])} · key ending <span class="mono">${esc(g.hint)}</span>`:`<span class="chip">Not connected</span>`}</p>
    ${mgr?`<div class="fields"><label>Data center<select id="tpItgRegion">${ITG_REGIONS.map(([k,l])=>`<option value="${k}"${(g.region||"us")===k?" selected":""}>${l}</option>`).join("")}</select></label>
      <label>API key<input id="tpItgKey" type="password" autocomplete="off" placeholder="${g.configured?"Paste a new key to replace it":"ITG.…"}"></label></div>
      <div class="btnrow"><button class="btn primary" data-tp="itgsave" ${Team.online?"":"disabled"}>${g.configured?"Save and test":"Connect"}</button>${g.configured?`<button class="btn" data-tp="itgtest">Test connection</button><button class="btn danger${armed==="itgclear"?" arm":""}" data-tp="itgclear">${armed==="itgclear"?"Click again to disconnect":"Disconnect"}</button>`:""}</div>
      <p class="hint" id="tpItgMsg" role="status">${esc(TeamPanel.itgMsg||"")}</p>
      ${g.configured?`<div class="fields"><label class="full">Default organization<select id="tpItgOrg"><option value="">${itgCache.orgs?"None":"Loading…"}</option>${(itgCache.orgs||[]).map(o=>`<option value="${o.id}"${o.id===g.orgId?" selected":""}>${esc(o.name)}</option>`).join("")}${g.orgId&&!itgCache.orgs?`<option value="${esc(g.orgId)}" selected>${esc(g.orgName)}</option>`:""}</select></label></div>`:""}
      <p class="hint">In IT Glue, create a dedicated key under <b>Account → Settings → API Keys</b> and leave password access off. The key is stored encrypted in your Supabase project and can't be read back, even by owners. RackGrid only reads organizations, configurations and locations.</p>`
    :`<p class="hint">${g.configured?`Anyone in the team can import and refresh devices from IT Glue${g.orgName?`. Default organization: ${esc(g.orgName)}`:""}.`:"Ask an owner or administrator to connect IT Glue."}</p>`}`;
}
async function itgTeamAction(a){
  const say=m=>{ TeamPanel.itgMsg=m; const el=$("#tpItgMsg"); if(el) el.textContent=m; };
  if(a==="itgsave"){ const key=$("#tpItgKey").value.trim(), region=$("#tpItgRegion").value;
    if(!key&&!Team.itg?.configured){ say("Paste the IT Glue API key first."); return; }
    say("Saving…"); const {error}=await sb().rpc("set_itglue",{p_team:Team.id,p_key:key,p_region:region}); if(error){ say(errText(error)); return; }
    $("#tpItgKey").value=""; itgCache.orgs=null; itgCache.cfg={}; await Team.loadItg(); say("Saved. Testing the connection…"); TeamPanel.render(); return itgTeamAction("itgtest"); }
  if(a==="itgtest"){ say("Testing…"); try{ const r=await itgCall("test"); say(`Connected. IT Glue returned ${r.organizations} organization${r.organizations===1?"":"s"}.`); itgOrgs(true).then(()=>TeamPanel.render()).catch(()=>{}); }catch(e){ say(e.message); } return; }
  if(a==="itgclear"){ if(armed!=="itgclear"){ armed="itgclear"; TeamPanel.render(); return; } armed=null; const {error}=await sb().rpc("clear_itglue",{p_team:Team.id}); if(error){ say(errText(error)); return; }
    itgCache.orgs=null; itgCache.cfg={}; await Team.loadItg(); say("IT Glue disconnected. The key was deleted."); TeamPanel.render(); return; }
}

if(window.RG_DEBUG) window.__rg={S,Team,Workspace,Picker,itgCache,get view(){ return view; }};
render(); boot();
})();
