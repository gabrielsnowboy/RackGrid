<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RackGrid: track server racks, network cables, IP addresses, site floor plans and wall ports, alone or with your team.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d5bd3">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>RackGrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: three-pane console — library/racks | rack elevation with cable gutter | inspector */
:root{
  --bg:#e9edf1; --panel:#ffffff; --rack:#f6f8fa; --rail:#dfe4ea;
  --ink:#15202b; --muted:#5c6876; --line:#d2d9e1; --soft:#eef2f6;
  --accent:#1d5bd3; --accent-soft:#e3ecfd; --port:#ffffff; --port-edge:#8a96a4;
  --port-on:#1a2531; --warn:#b4410f; --warn-soft:#fdebe2; --ok:#17784a;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-tag:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#151c23; --rack:#11171d; --rail:#232d37;
  --ink:#e4e9ee; --muted:#8a96a3; --line:#28323c; --soft:#1b232b;
  --accent:#6b9dff; --accent-soft:#1c2a44; --port:#0e1318; --port-edge:#5f6c79;
  --port-on:#d7dee6; --warn:#ff8a57; --warn-soft:#3a2016; --ok:#4cc38a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#151c23; --rack:#11171d; --rail:#232d37;
  --ink:#e4e9ee; --muted:#8a96a3; --line:#28323c; --soft:#1b232b;
  --accent:#6b9dff; --accent-soft:#1c2a44; --port:#0e1318; --port-edge:#5f6c79;
  --port-on:#d7dee6; --warn:#ff8a57; --warn-soft:#3a2016; --ok:#4cc38a; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;gap:0;height:100%;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.pane{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-width:0}
.pane.right{border-right:0;border-left:1px solid var(--line)}
.center{display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand b{font-family:var(--f-tag);font-size:22px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.brand svg{flex:none}
.sec{padding:10px 16px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.racklist{display:flex;flex-direction:column;gap:2px}
.racklist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px}
.racklist button:hover{background:var(--soft)}
.racklist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.racklist small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.lib{display:flex;flex-direction:column;gap:2px}
.lib button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;padding:6px 8px;border-radius:6px;text-align:left;cursor:grab}
.lib button:hover{background:var(--soft);border-color:var(--line)}
.lib .glyph{width:34px;height:14px;border:1.5px solid var(--port-edge);border-radius:2px;flex:none;display:grid;grid-auto-flow:column;gap:1px;padding:2px}
.lib .glyph i{background:var(--port-edge);border-radius:1px}
.lib small{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:6px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--port-edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn.danger.arm{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{min-width:0}
.crumb h1{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.crumb p{margin:0;color:var(--muted);font-size:12px}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);min-width:0;flex:0 1 280px}
.search input{border:0;background:none;outline:0;min-width:0;width:100%}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:7px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:5px;font-weight:500;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--panel)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.stage{flex:1;overflow:auto;padding:24px 16px 40px}
.rackwrap{position:relative;margin:0 auto;width:max-content;padding-right:100px}
.rack .rgrip{position:absolute;left:40px;right:14px;height:14px;border:0;background:transparent;padding:0;cursor:ns-resize;display:flex;align-items:center;justify-content:center;z-index:4;touch-action:none}
.rack .rgrip.top{top:0}.rack .rgrip.bottom{bottom:0}
.rack .rgrip i{width:56px;height:4px;border-radius:2px;background:var(--port-edge);opacity:.35;transition:opacity .12s,width .12s}
.rack .rgrip:hover i,.rack .rgrip:focus-visible i,.rack .rgrip.on i{opacity:1;width:80px;background:var(--accent)}
.growghost{position:absolute;left:-10px;right:-10px;z-index:6;pointer-events:none;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:3px}
.growghost.cut{border-color:var(--warn);background:repeating-linear-gradient(135deg,rgba(214,64,58,.18) 0 6px,transparent 6px 12px)}
.growghost::after{content:attr(data-label);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px var(--f-mono);background:var(--ink);color:var(--panel);padding:3px 8px;border-radius:4px}
.growghost.e-top::after{bottom:4px}
.growghost.e-bottom::after{top:4px}
.growghost.e-top[style*="height: 0px"]::after{bottom:auto;top:-26px}
.growghost.e-bottom[style*="height: 0px"]::after{top:4px}
.growghost.lim{border-color:var(--warn)}
.growbox{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;margin-bottom:6px}
.growbox span{font-size:12px;color:var(--muted);font-weight:600}
.growbox .btn{padding:5px 8px}
/* rack types */
.rack.k-open4,.rack.k-open2,.rack.k-wallopen{background:transparent;border-style:dashed}
.rack.k-open4 .body,.rack.k-open2 .body,.rack.k-wallopen .body{background:repeating-linear-gradient(0deg,transparent 0 33px,var(--line) 33px 34px)}
.rack.k-open2 .body{border-left-width:14px;border-right-width:14px}
.rack.k-open2::after{content:"";position:absolute;left:30px;right:6px;bottom:-9px;height:9px;background:var(--rail);border-radius:2px}
.rack.wallmount{border-radius:12px;border-width:2px}
.rack.wallmount::before{content:"";position:absolute;left:-16px;top:-14px;bottom:-14px;width:9px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 6px);opacity:.55}
.rack.k-wallswing .body{box-shadow:inset -6px 0 0 var(--soft)}
.mrack.wall{align-self:flex-start}
.multi .rack.k-open4 .body,.multi .rack.k-open2 .body,.multi .rack.k-wallopen .body{background:repeating-linear-gradient(0deg,transparent 0 19px,var(--line) 19px 20px)}
.pin.rk.wl i{border-radius:8px;background:#fff;border-color:#15202b}
.pin.rk.wl i::after{background:repeating-linear-gradient(#15202b 0 2px,transparent 2px 5px)}
.rkpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.rkpick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;min-width:0}
.rkpick button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.rkpick b{font-size:13px}.rkpick small{font-size:11px;color:var(--muted)}
.rkico{display:block;width:34px;height:40px;margin-bottom:6px;position:relative}
.rkico i{position:absolute;inset:0;border:2px solid var(--ink);border-radius:3px;background:repeating-linear-gradient(0deg,transparent 0 5px,var(--line) 5px 7px)}
.rkico.k-open4 i,.rkico.k-wallopen i{border-style:dashed;background:repeating-linear-gradient(0deg,transparent 0 5px,var(--line) 5px 6px)}
.rkico.k-open2 i{border-top:0;border-bottom:0;border-left-width:4px;border-right-width:4px;border-radius:0}
.rkico.k-open2::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:3px;background:var(--ink)}
.rkico.k-wall,.rkico.k-wallopen,.rkico.k-wallswing{height:24px;margin-top:8px;margin-bottom:14px;margin-left:8px}
.rkico.k-wall::before,.rkico.k-wallopen::before,.rkico.k-wallswing::before{content:"";position:absolute;left:-8px;top:-10px;bottom:-10px;width:4px;background:repeating-linear-gradient(135deg,var(--muted) 0 1px,transparent 1px 4px)}
.rkico.k-wallswing i{border-right-width:5px}
#rkSizes{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 4px}
#rkSizes .chipbtn{padding:3px 9px;font-size:12px}
#rkSizes .chipbtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media (max-width:560px){ .rkpick{grid-template-columns:repeat(2,1fr)} }
.rackwrap.xstub{padding-top:calc(var(--xs,1) * 13px + 16px)}
.allwrap{position:relative;margin:0 auto;width:max-content;padding:62px 64px 10px 0}
.allwrap .tray{position:absolute;left:30px;right:16px;top:6px;height:46px;border:1.5px dashed var(--line);border-radius:6px;z-index:0}
.allwrap .tray span{position:absolute;left:8px;top:-8px;padding:0 6px;background:var(--bg);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mracks{display:flex;gap:64px;align-items:flex-end;transform-origin:0 0;width:max-content}
.allbar{display:flex;justify-content:flex-end;margin:-8px 0 6px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 6px 30px}
.mhead .linkbtn{font-weight:600;font-size:13px}
.mhead small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.mrack.cur .rack{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.multi .rack{grid-template-columns:30px 450px;padding:8px 0}
.multi .body{margin-right:8px;border-left-width:7px;border-right-width:7px}
.multi .ucol span{font-size:9px;right:5px}
.multi .dev{cursor:pointer}
.multi .dev .tag{width:22px;cursor:pointer}
.multi .dev .tag b{font-size:9.5px}
.multi .face{gap:6px;padding:0 6px}
.multi .face .meta{min-width:40px;max-width:84px}
.multi .face .meta b{font-size:10.5px}
.multi .face .meta small{font-size:9px}
.multi .ports{gap:5px}
.multi .grp{gap:1.5px}
.multi .pcol em{display:none}
.multi .port{width:10px;height:8px;border-width:1.2px}
.multi .port.rj45::after{left:2px;right:2px;height:2px;bottom:-1.2px;border-width:1.2px}
.multi .port.sfp{width:13px;height:7px}
.multi .port.lc{width:11px;height:8px;border-radius:4px}
.multi .face.batt .cells i{width:22px;height:8px}
.port.xr{box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--accent-soft)}
.cables text.xlab{font:600 10.5px var(--f-mono);fill:var(--muted)}
.cables text.xlab.hot{fill:var(--accent)}
.rack{position:relative;z-index:1;display:grid;grid-template-columns:40px 680px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 0 14px 0}
.ucol{position:relative}
.ucol span{position:absolute;right:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateY(-50%)}
.body{position:relative;background:var(--rack);border-left:10px solid var(--rail);border-right:10px solid var(--rail);margin-right:14px}
.slot{position:absolute;left:0;right:0;border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.slot:hover{color:var(--muted);background:var(--soft)}
.slot.pick{background:var(--accent-soft);color:var(--accent)}
.ghost{position:absolute;left:0;right:0;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:4px;pointer-events:none;z-index:4;opacity:.9}
.ghost.bad{border-color:var(--warn);background:var(--warn-soft)}

.dev{position:absolute;left:0;right:0;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:3px;z-index:2;cursor:pointer;transition:box-shadow .12s}
.dev:hover{box-shadow:0 0 0 1px var(--port-edge)}
.dev.sel{box-shadow:0 0 0 2px var(--accent);z-index:3}
.dev.dim{opacity:.35}
.dev.hit{box-shadow:0 0 0 2px var(--ok)}
.dev .tag{width:30px;flex:none;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);background:var(--soft);cursor:grab;
  background-image:radial-gradient(var(--port-edge) 1px,transparent 1.2px);background-size:5px 5px;background-position:center}
.dev .tag b{background:var(--soft);padding:2px 0}
.dev{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dev.dragging{z-index:20;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.25),0 0 0 2px var(--accent);opacity:.92;transition:none}
.dev.dragging .port{pointer-events:none}
body.dragging-any,body.dragging-any *{cursor:grabbing!important;user-select:none!important}
.ghost::after{content:attr(data-label);position:absolute;left:calc(100% + 18px);top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);white-space:nowrap;background:var(--panel);padding:2px 6px;border-radius:4px;border:1px solid var(--accent)}
.ghost.bad::after{color:var(--warn);border-color:var(--warn)}
.dragchip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;font-weight:600;padding:5px 10px;border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cables.hide{opacity:0}
.dev .rz{position:absolute;left:30px;right:0;bottom:-3px;height:8px;cursor:ns-resize;z-index:4;touch-action:none}
.dev .rz::after{content:"";position:absolute;left:50%;bottom:3px;width:34px;height:3px;margin-left:-17px;border-radius:2px;background:var(--port-edge);opacity:0;transition:opacity .12s}
.dev:hover .rz::after,.dev.sel .rz::after,.dev.resizing .rz::after{opacity:.9}
.dev.resizing{z-index:20;box-shadow:0 0 0 2px var(--accent);transition:none}
.face .meta small.due{color:var(--warn);font-weight:600}
.face.batt{background:repeating-linear-gradient(90deg,transparent 0 3px,var(--soft) 3px 4px)}
.face.batt .cells{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;max-width:260px;justify-content:flex-end;align-content:center;height:100%;padding:4px 0}
.face.batt .cells i{width:38px;height:12px;border:1.5px solid var(--port-edge);border-radius:2px;position:relative;background:linear-gradient(90deg,var(--ok) 0 70%,transparent 70%);opacity:.8}
.face.batt .cells i::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--port-edge)}
.cx-preview{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:-4px 0 14px}
.lib button{touch-action:manipulation}
.dev .tag b{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-tag);font-size:12px;letter-spacing:.04em;font-weight:600;white-space:nowrap;overflow:hidden;max-height:100%}
.dev.type-patch .tag,.dev.type-patch48 .tag,.dev.type-fiber .tag{background:var(--accent-soft)}
.dev.type-fiber .tag b{color:var(--accent)}
.face{flex:1;display:flex;align-items:center;gap:10px;padding:0 8px;min-width:0;overflow:hidden}
.face .meta{display:flex;flex-direction:column;min-width:56px;max-width:110px;flex:1 1 auto;line-height:1.15}
.face .meta b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face .meta small{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face.blank{background:repeating-linear-gradient(90deg,transparent 0 6px,var(--soft) 6px 8px)}
.face.mgr{background:repeating-linear-gradient(90deg,var(--soft) 0 18px,transparent 18px 26px)}
.ports{display:flex;gap:10px;align-items:center;margin-left:auto}
.grp{display:flex;gap:2px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:1px}
.pcol em{font-style:normal;font-family:var(--f-mono);font-size:8px;line-height:9px;color:var(--muted);height:9px}
.port{width:14px;height:11px;padding:0;border:1.5px solid var(--port-edge);background:var(--port);border-radius:1.5px;position:relative;display:block}
.port.rj45::after{content:"";position:absolute;left:3px;right:3px;bottom:-1.5px;height:3px;background:var(--rack);border:1.5px solid var(--port-edge);border-bottom:0}
.port.sfp{width:18px;height:10px;border-radius:1px}
.port.lc{width:16px;height:11px;border-radius:5px}
.port.on{background:var(--port-on);border-color:var(--port-on)}
.port.on::after{background:var(--port-on);border-color:var(--port-on)}
.port.ext{background:repeating-linear-gradient(45deg,var(--port-on) 0 2px,var(--port) 2px 4px)}
.port .ipdot{position:absolute;top:-4px;right:-4px;width:6px;height:6px;border-radius:50%;background:var(--ok);border:1px solid var(--panel)}
.port .ipdot.dup{background:var(--warn)}
.port.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.port.peer{outline:2px dashed var(--accent);outline-offset:1px}
.port.hit{outline:2px solid var(--ok);outline-offset:1px}
.port .cc{position:absolute;left:-1px;right:-1px;bottom:-5px;height:2px;border-radius:1px}
.cables{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.cables.under{z-index:0}
.cables path{fill:none;stroke-width:1.8;opacity:.7;stroke-linejoin:round;stroke-linecap:round}
.cables path.cold{opacity:.25}
.cables path.lit{opacity:1;stroke-width:2.6}
.cables path.casing{stroke:var(--panel);stroke-width:6;opacity:.85}
.cables path.hot{stroke-width:2.6;opacity:1}
.cables .end{stroke:var(--panel);stroke-width:1.5}
.cables path.moving{opacity:.12}
.cables .dragline{stroke-width:2.6;stroke-dasharray:6 4;opacity:1;fill:none}
.cables .dragdot{opacity:1}
.port.on{cursor:grab}
.port.dragsrc{outline:2px dashed var(--accent);outline-offset:2px}
.port.drop-ok{outline:2px solid var(--ok);outline-offset:2px;transform:scale(1.3);z-index:3}
.port.drop-bad{outline:2px solid var(--warn);outline-offset:2px}

/* table tab */
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:20px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.mono,.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tblhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px}

/* inspector */

/* modal + toast */

@media (max-width:1000px){

}

  .lib{display:grid;grid-template-columns:1fr 1fr}
  .search{flex-basis:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.modal.wide{width:min(980px,100%)}

  background-image:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop .h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--accent);border-radius:3px;margin:-7px 0 0 -7px}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-n{left:50%;top:0;cursor:ns-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}.h-e{left:100%;top:50%;cursor:ew-resize}
.h-se{left:100%;top:100%;cursor:nwse-resize}.h-s{left:50%;top:100%;cursor:ns-resize}.h-sw{left:0;top:100%;cursor:nesw-resize}.h-w{left:0;top:50%;cursor:ew-resize}
.pe-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:12px}

.pin .pn{position:absolute;right:-8px;top:-8px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#15202b;color:#fff;font:600 10px/15px var(--f-ui);text-align:center;z-index:1}
.legend i.nb{width:auto;height:14px;min-width:14px;border:0;border-radius:7px;background:var(--ink);color:var(--panel);font:600 10px/14px var(--f-ui);font-style:normal;text-align:center;padding:0 3px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}

.pin span{font-family:var(--f-mono);font-size:10px;font-weight:500;background:rgba(255,255,255,.92);color:#15202b;padding:0 4px;border-radius:3px;white-space:nowrap;border:1px solid #d2d9e1}
.pin.ap i{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #0b8a6b;color:#0b8a6b;display:flex;align-items:center;justify-content:center}

  background:radial-gradient(circle,rgba(11,138,107,.26) 0%,rgba(11,138,107,.14) 55%,rgba(11,138,107,.04) 100%);border:1.5px dashed rgba(11,138,107,.55)}

.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:-8px 2px 14px}

<script>
(() => {
const UH = 34;
const COLORS = {blue:"#2f6fe0",yellow:"#e0b21a",green:"#2f9e55",red:"#d6403a",orange:"#e5772b",purple:"#8a4fd6",white:"#c9d0d8",black:"#3a4450",grey:"#8b95a1",aqua:"#1fb5c9",pink:"#e05aa6"};
const TYPES = {
  patch:  {label:"Patch Panel 24-port", h:1, ports:[["rj45",24]], code:"PP"},
  patch48:{label:"Patch Panel 48-port", h:1, ports:[["rj45",48]], code:"PP"},
  fiber:  {label:"Fiber Patch Panel", h:1, ports:[["lc",24]], code:"FPP"},
  switch: {label:"Switch 24-port", h:1, ports:[["rj45",24],["sfp",4]], code:"SW"},
  switch48:{label:"Switch 48-port", h:1, ports:[["rj45",48],["sfp",4]], code:"SW"},
  router: {label:"Router", h:1, ports:[["rj45",4],["sfp",2]], code:"RT"},
  firewall:{label:"Firewall", h:1, ports:[["rj45",8],["sfp",2]], code:"FW"},
  server: {label:"Server", h:2, ports:[["rj45",4],["rj45",1]], code:"SRV"},
  nas:    {label:"Storage / NAS", h:2, ports:[["rj45",4]], code:"NAS"},
  ups:    {label:"UPS", h:2, ports:[["rj45",1]], code:"UPS"},
  battery:{label:"UPS Battery Pack", h:2, ports:[], code:"BAT"},
  pdu:    {label:"PDU", h:1, ports:[], code:"PDU"},
  manager:{label:"Cable Manager", h:1, ports:[], code:"CM"},
  shelf:  {label:"Shelf / Tray", h:1, ports:[], code:"SH"},
  blank:  {label:"Blank Panel", h:1, ports:[], code:"BL"},
  custom: {label:"Custom Device…", h:1, ports:[["rj45",8]], code:"DEV"},
};
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2,"0");

/* ---------- state ---------- */
const S = {racks:{}, sites:{}, plans:{}};
let curSite=null, curId=null, curFloor=null, view="site";
let sel={dev:null,port:null,slot:null,pin:null};
let showCov=true;
let q="", showCables=true, loaded=false, readOnly=false, armed=null, menuOpen=false, placeMode=null, zoom=1;

const site = () => S.sites[curSite] || null;
const rack = () => S.racks[curId] || null;
const sortBy = (obj,f) => Object.keys(obj).sort((a,b)=>(obj[a][f]||"").localeCompare(obj[b][f]||"",undefined,{numeric:true}));
function rackSite(r){ return S.sites[r.siteId] ? r.siteId : null; }
function siteRacks(){ return sortBy(S.racks,"name").map(id=>S.racks[id]).filter(r=>rackSite(r)===curSite || rackSite(r)===null); }
function floor(){ const s=site(); if(!s) return null; return s.floors.find(f=>f.id===curFloor) || s.floors[0] || null; }
function devById(r,id){ return r?.devices.find(d => d.id === id); }
function makePorts(spec){ const out=[]; let n=1; for(const [kind,count] of spec) for(let i=0;i<count;i++) out.push({n:n++,kind,label:"",ip:"",vlan:"",mac:"",link:null,ext:"",cable:"",color:"",len:"",note:""}); return out; }
function nextName(r,type){ const code=TYPES[type]?.code||"DEV"; let i=1; const names=new Set(r.devices.map(d=>d.name)); while(names.has(code+pad2(i))) i++; return code+pad2(i); }
function fits(r,u,h,ignore){ if(u<1||u+h-1>r.units) return false; return !r.devices.some(d => d.id!==ignore && u <= d.u+d.h-1 && d.u <= u+h-1); }
/* rack types and unit numbering */
const RACK_KINDS={
  cabinet:{label:"Floor cabinet (enclosed, 4-post)",short:"Floor cabinet",desc:"Stands on the floor, with doors and side panels",units:42},
  open4:{label:"Open frame, 4-post",short:"4-post open frame",desc:"Four posts, no doors or sides",units:42},
  open2:{label:"Open frame, 2-post (relay rack)",short:"2-post relay rack",desc:"Two posts, common in telecom closets",units:45},
  wall:{label:"Wall-mount cabinet",short:"Wall-mount cabinet",desc:"Hangs on the wall, with a door",units:12},
  wallopen:{label:"Wall-mount open bracket",short:"Wall-mount bracket",desc:"Hangs on the wall, open",units:6},
  wallswing:{label:"Wall-mount swing-out cabinet",short:"Swing-out wall cabinet",desc:"Front section swings out for rear access",units:15},
};
const rkind = r => RACK_KINDS[r?.kind] || RACK_KINDS.cabinet;
const isWall = r => /^wall/.test(r?.kind||"");
const MAXU=60;
// U numbers are stored bottom-up (U1 at the bottom). Racks numbered top-down only change what's shown.
const un = (r,u) => r?.numbering==="top" ? r.units-u+1 : u;
function uSpan(r,u,h=1){ const a=un(r,u), b=un(r,u+h-1); const lo=Math.min(a,b), hi=Math.max(a,b); return `U${lo}${h>1?"–"+hi:""}`; }
const topUsed = r => Math.max(0,...r.devices.map(d=>d.u+d.h-1));
const lowUsed = r => r.devices.length ? Math.min(...r.devices.map(d=>d.u)) : r.units+1;
// grow (+) or shrink (−) a rack at the top or the bottom; devices keep their place in the rack
function growLimits(r,edge){ const min = edge==="top" ? Math.max(1,topUsed(r))-r.units : -(Math.min(lowUsed(r),r.units+1)-1);
  return {min:Math.max(min,1-r.units), max:MAXU-r.units}; }
function growRack(r,edge,delta){
  const lim=growLimits(r,edge); if(delta<lim.min||delta>lim.max||!delta) return false;
  r.units+=delta; if(edge==="bottom") for(const d of r.devices) d.u+=delta;
  sel.slot=null; return true; }
function growMsg(r,edge,delta){ const n=Math.abs(delta);
  return `${delta>0?"Added":"Removed"} ${n}U at the ${edge} of ${r.name}. It's now ${r.units}U.${edge==="bottom"&&r.devices.length&&r.numbering!=="top"?` Device unit numbers moved ${delta>0?"up":"down"} by ${n}.`:""}${edge==="top"&&r.devices.length&&r.numbering==="top"?` Device unit numbers moved ${delta>0?"down":"up"} by ${n}.`:""}`; }
function growBlocked(r,edge,delta){ const lim=growLimits(r,edge);
  if(delta>lim.max) return `Racks can be up to ${MAXU}U.`;
  if(delta<lim.min) return r.units+delta<1?"A rack needs at least 1U.":`A device sits in the ${edge} unit${edge==="top"?"":"s"}. Move it before removing units there.`;
  return ""; }
function firstFree(r,h){ for(let top=r.units; top>=h; top--){ const u=top-h+1; if(fits(r,u,h)) return u; } return null; }
function newDevice(r,type,u){ const t=TYPES[type]; return {id:uid(),name:nextName(r,type),type,u,h:t.h,model:"",serial:"",ip:"",notes:"",ports:makePorts(t.ports)}; }
const today = () => new Date().toISOString().slice(0,10);
function battDue(d){ return (d.type==="ups"||d.type==="battery") && d.replaceBy && d.replaceBy<=today(); }
function setPortCounts(r,d,want){
  const keep={rj45:[],sfp:[],lc:[]}; d.ports.forEach((pt,i)=>keep[pt.kind]?.push(i));
  for(const k in keep) keep[k].slice(want[k]).forEach(i=>unlinkPort(r,d,i));
  const old=d.ports, map={}, np=[]; let n=1;
  for(const k of ["rj45","sfp","lc"]) for(let i=0;i<Math.min(200,want[k]||0);i++){ const oi=keep[k][i]; const pt=oi!=null?{...old[oi]}:makePorts([[k,1]])[0]; pt.n=n++; if(oi!=null) map[oi]=np.length; np.push(pt); }
  for(const rr of Object.values(S.racks)) for(const o of rr.devices) if(o.id!==d.id) o.ports.forEach(op=>{ if(op.link&&op.link.d===d.id&&linkRack(rr,op.link)?.id===r.id){ op.link.p=map[op.link.p]; touch(rr); } });
  np.forEach(pt=>{ if(pt.link&&pt.link.d===d.id&&!(pt.link.r&&pt.link.r!==r.id)) pt.link.p=map[pt.link.p]; });
  for(const x of pinsAll()){ for(const jpo of jp(x.p)) if(jpo.link?.r===r.id && jpo.link.d===d.id && jpo.link.p!=null){ const m=map[jpo.link.p]; jpo.link.p = m==null?null:m; persist("sites",x.s.id); }
    const u=hasUp(x.p)?x.p.up:null; if(u?.r===r.id&&u.d===d.id&&u.p!=null){ const m=map[u.p]; u.p = m==null?null:m; persist("sites",x.s.id); } }
  d.ports=np;
}
/* cable length check: recorded length vs. the run between the two devices */
function parseLen(v){ const m=String(v||"").trim().toLowerCase().replace(",",".").match(/^([\d.]+)\s*(m|meters?|metres?|cm|mm|ft|feet|foot|'|in|inch|inches|")?$/); if(!m) return null;
  const n=parseFloat(m[1]); if(!isFinite(n)) return null; const u=m[2]||"m";
  return u==="cm"?n/100 : u==="mm"?n/1000 : (u==="ft"||u==="feet"||u==="foot"||u==="'")?n*.3048 : (u.startsWith("in")||u==='"')?n*.0254 : n; }
function runLen(a,b){ const du=Math.abs((a.u+(a.h-1)/2)-(b.u+(b.h-1)/2)); return du*.04445 + (du<=2 ? .15 : .5); }
// between racks: up to the top of each rack, along the tray (about 0.6 m per rack position), plus slack
function crossLen(ra,a,rb,b){ const ids=sortBy(S.racks,"name").filter(id=>rackSite(S.racks[id])===rackSite(ra)); const ia=ids.indexOf(ra.id), ib=ids.indexOf(rb.id);
  const gap=(ia<0||ib<0)?1:Math.max(1,Math.abs(ia-ib)); const up=(r,d)=>Math.max(0,r.units-(d.u+(d.h-1)/2))*.04445+.3; return up(ra,a)+up(rb,b)+gap*.6+.5; }
function shortCable(r,d,p){ const pt=d.ports[p]; const pe=peer(r,pt); const have=parseLen(pt?.len); if(!pe||have==null) return null;
  const need=pe.cross?crossLen(r,d,pe.r,pe.d):runLen(d,pe.d); return have+.005<need ? {have,need,o:pe.d,op:pe.i,or:pe.r,cross:pe.cross} : null; }
const fmtM = m => m<1 ? Math.round(m*100)+" cm" : m.toFixed(1).replace(/\.0$/,"")+" m";
function portName(d,p){ const pt=d.ports[p]; if(!pt) return d.name+" · ?"; return `${d.name} · ${pt.kind==="sfp"?"SFP ":""}${pt.n}${pt.label?` (${pt.label})`:""}`; }

/* cable ends: port.link is {d,p} for a port in the same rack, or {r,d,p} for a port in another rack */
const linkRack=(r,l)=> l?.r && l.r!==r?.id ? S.racks[l.r] : r;
function peer(r,pt){ const l=pt?.link; if(!l) return null; const pr=linkRack(r,l); const pdv=pr&&devById(pr,l.d); if(!pdv||!pdv.ports[l.p]) return null; return {r:pr,d:pdv,i:l.p,pt:pdv.ports[l.p],cross:pr.id!==r.id}; }
const mkLink=(from,to,d,p)=> to.id===from.id ? {d:d.id,p} : {r:to.id,d:d.id,p};
const pointsAt=(r,pt,rb,b,j)=>{ const l=pt?.link; return !!l && l.d===b.id && l.p===j && linkRack(r,l)?.id===rb.id; };
const touched=new Set(); const touch=r=>{ if(r) touched.add(r.id); };
function peerName(r,pe){ return pe ? (pe.r.id!==r.id?`${pe.r.name} · `:"")+portName(pe.d,pe.i) : "another port"; }
function siteRacksOf(r){ const a=rackSite(r); return sortBy(S.racks,"name").map(id=>S.racks[id]).filter(x=>{ const b=rackSite(x); return a===b||!a||!b; }); }
function unlinkPort(r,d,p){ const pt=d.ports[p]; if(!pt?.link) return; const pe=peer(r,pt); if(pe&&pointsAt(pe.r,pe.pt,r,d,p)){ pe.pt.link=null; touch(pe.r); } pt.link=null; }
function linkPorts(ra,a,pa,rb,b,pb){ unlinkPort(ra,a,pa); unlinkPort(rb,b,pb); a.ports[pa].ext=""; b.ports[pb].ext="";
  a.ports[pa].link=mkLink(ra,rb,b,pb); b.ports[pb].link=mkLink(rb,ra,a,pa); touch(ra); touch(rb);
  const A=a.ports[pa],B=b.ports[pb]; for(const k of ["cable","color","len"]){ const v=A[k]||B[k]; A[k]=v; B[k]=v; } }
function syncCable(r,d,p){ const pt=d.ports[p]; const pe=peer(r,pt); if(!pe) return; for(const k of ["cable","color","len"]) pe.pt[k]=pt[k]; touch(pe.r); }

/* wall ports */
function pinsAll(){ const out=[]; for(const s of Object.values(S.sites)) for(const p of (s.pins||[])) out.push({s,p}); return out; }
/* a wall port (jack plate) has one or more ports: A, B, C… each patched and used separately */
const newJackPort = () => ({link:null,cable:"",endpoint:"",eip:"",mac:""});
function jp(p){ if(p.kind!=="jack") return [];

/* ---------- persistence ---------- */
let db=null, cols={}, mode="loading", assetsNs;
const dirty=new Set(), inflight=new Set(), again=new Set(), timers={};
const LSKEY={racks:"rackbook-v1",sites:"rackbook-sites",plans:"rackbook-plans"};
function persist(c,id){ if(readOnly) return; if(mode==="team"){ if(c!=="plans") Team.queue(c,id); return; } const key=c+"/"+id; dirty.add(key);
  if(mode==="local"){ try{ localStorage.setItem(LSKEY[c], JSON.stringify(S[c])); }catch(e){ toast("This browser's storage is full. Export a backup."); } dirty.delete(key); return; }
  clearTimeout(timers[key]); timers[key]=setTimeout(()=>flush(c,id),500); }
async function flush(c,id){
  const key=c+"/"+id; if(!cols[c]) return;
  if(inflight.has(key)){ again.add(key); return; }
  inflight.add(key);
  try{ if(S[c][id]) await cols[c].doc(id).set(S[c][id]); else await cols[c].doc(id).delete(); }
  catch(e){
    if(e?.code==="invalid_argument" && S[c][id]){ if(c==="plans") toast("That floor plan is too large to save here. Try a smaller image."); else { readOnly=true; toast("You can view this site but don't have permission to edit it."); render(); } }
    else if(e?.code==="quota_exceeded") toast("Storage is full. Delete something you no longer need and try again.");
    else if(e?.code==="unavailable"){ setTimeout(()=>{ inflight.delete(key); flush(c,id); },800+Math.random()*800); return; }
    else toast("Couldn't save the last change. Check your connection.");
  }
  inflight.delete(key);
  if(again.has(key)){ again.delete(key); flush(c,id); } else dirty.delete(key);
}
const flushTouched = () => { for(const id of touched) if(id!==curId&&S.racks[id]) persist("racks",id); touched.clear(); };

async function boot(){
  try{ db = window.claude?.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db && !IN_CLAUDE){ const ws=await Workspace.choose(); if(ws.kind==="team"){ if(!sb()){ ssSet(WS_KEY,null); lsSet("rg-ws-skip","1"); location.reload(); return; } return Team.boot(ws.teamId); } }
  if(!db){ mode="local"; for(const c of ["racks","sites","plans"]){ try{ S[c]=JSON.parse(localStorage.getItem(LSKEY[c])||"{}")||{}; }catch(e){ S[c]={}; } }
    loaded=true; pickDefaults(); render(); return; }
  mode="db"; for(const c of ["racks","sites","plans"]) cols[c]=db.collection(c);
  const ready={racks:false,sites:false};
  const t=setTimeout(()=>{ if(!loaded){ $("#rackTitle").textContent="Can't reach your saved sites yet"; $("#rackSub").textContent="Still trying. Check your connection."; } },10000);
  for(const c of ["racks","sites"]){
    cols[c].onSnapshot(snap=>{
      const seen=new Set();
      for(const doc of snap.docs){ seen.add(doc.id); if(!dirty.has(c+"/"+doc.id)) S[c][doc.id]=clone(doc.data()); }
      for(const id of Object.keys(S[c])) if(!seen.has(id) && !dirty.has(c+"/"+id)) delete S[c][id];
      if(!snap.metadata.fromCache || snap.size) ready[c]=true;
      if(ready.racks&&ready.sites){ clearTimeout(t); loaded=true; }
      pickDefaults(); if(!pd) render();
    }, ()=>{ clearTimeout(t); loaded=true; toast("Lost connection to your saved data. Reload to reconnect."); render(); });
  }
}

const idb = { p:null,
  open(){ return this.p ||= new Promise((res,rej)=>{ const r=indexedDB.open("rackgrid",2); r.onupgradeneeded=()=>{ for(const n of ["plans","cache","outbox"]) if(!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async run(mode,fn,store="plans"){ const d=await this.open(); return new Promise((res,rej)=>{ const tx=d.transaction(store,mode); const q=fn(tx.objectStore(store)); tx.oncomplete=()=>res(q?.result); tx.onerror=()=>rej(tx.error); }); },
  get(k,st){ return this.run("readonly",x=>x.get(k),st); }, put(k,v,st){ return this.run("readwrite",x=>x.put(v,k),st); }, del(k,st){ return this.run("readwrite",x=>x.delete(k),st); } };
const localUrls={};

function dropPlanStorage(pl){

  if(pl.inline){ delete S.plans[pl.inline]; persist("plans",pl.inline); }
  if(pl.local){ idb.del(pl.local).catch(()=>{}); if(localUrls[pl.local]) URL.revokeObjectURL(localUrls[pl.local]); delete localUrls[pl.local]; }
}
async function planBlob(pl){

  if(pl.local){ const b=await idb.get(pl.local); if(!b) throw 0; return b; }
  if(pl.inline){ let d=S.plans[pl.inline]?.data; if(!d && mode==="db"){ const sn=await cols.plans.doc(pl.inline).get(); d=sn.data()?.data; } if(!d) throw 0; return await (await fetch(d)).blob(); }

const blobToDataURL = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); });
function planSrc(s,f){
  if(!f?.plan) return null;
  if(f.plan.asset) return "/_blob/"+f.plan.asset;
  if(f.plan.sb) return Team.planUrl(f.plan.sb);
  if(f.plan.local){ const k=f.plan.local; if(localUrls[k]) return localUrls[k];
    if(!(k in localUrls)){ localUrls[k]=""; idb.get(k).then(b=>{ if(b){ localUrls[k]=URL.createObjectURL(b); render(); } }).catch(()=>{}); } return null; }
  if(f.plan.inline){ const k=f.plan.inline; if(S.plans[k]?.data) return S.plans[k].data;

    else if(b&&gut[pe.r.id]!=null){ const B=endOf(b), ax=lane(r), bx=lane(pe.r), ty=trayY+(xl++%8)*4; ends.push(B);
      pts=[[A.x,A.py],[A.x,A.seam],[ax,A.seam],[ax,ty],[bx,ty],[bx,B.seam],[B.x,B.seam],[B.x,B.py]]; }

      pts=[[A.x,A.py],[A.x,A.seam],[ax,A.seam],[ax,ty],[ex,ty]]; }
    const path=roundPath(pts,6);
    const hot = !!selKey && (ka===selKey||kb===selKey), lit = !selKey && sel.dev && (d.id===sel.dev||pe.d.id===sel.dev);
    if(pe.cross&&!(b&&gut[pe.r.id]!=null)&&(hot||lit)) stubs[pe.r.id].hot=true;
    const c=COLORS[pt.color]||pt.color||"var(--accent)", sh=shortCable(r,d,i)?' stroke-dasharray="7 5"':"";
    if(hot){ top+=`<path class="casing" d="${path}"/><path class="hot" stroke="${c}"${sh} d="${path}"/>${ends.map(E=>`<circle class="end" cx="${E.x}" cy="${E.py}" r="3" fill="${c}"/>`).join("")}`; }
    else low+=`<path class="${lit?"lit":any?"cold":""}" stroke="${c}"${sh} d="${path}"/>`;
  });

    top+=sk.map((s,k)=>`<text class="xlab${s.hot?" hot":""}" x="${x}" y="${trayY-6-k*13}" text-anchor="end">→ ${esc(s.name)} · ${s.n} cable${s.n===1?"":"s"}</text>`).join(""); }
  for(const el of [svg,under]){ el.setAttribute("width",box.width+120); el.setAttribute("height",box.height); }
  under.innerHTML=low; svg.innerHTML=top;
}

function cableRows(r){

      rows.push({short:!!shortCable(r,d,i),a:portName(d,i),b:pe?peerName(r,pe):"?",cross:!!pe?.cross,cable:pt.cable,color:pt.color,len:pt.len,d:d.id,p:i}); } }
    else if(pt.ext) rows.push({a:portName(d,i),b:pt.ext+" (outside rack)",cable:pt.cable,color:pt.color,len:pt.len,d:d.id,p:i});

  });

}
function ipRows(r){

      const jk=jm[`${r.id}:${d.id}:${i}`]; if(jk&&jk.x.eip){ const t=trace(jk.p,jk.j); out.push({ip:jk.x.eip,what:`${jk.x.endpoint||"Device"} via wall port ${jname(jk.p,jk.j)}`,vlan:t?.op?.vlan||pt.vlan,mac:jk.x.mac||"",pin:jk.p.id,j:jk.j,dup:dups.has(jk.x.eip.trim())}); } }); }

  else if(placeMode==="ap"){ const used=new Set(s.pins.map(p=>p.label)); let i=s.pins.filter(p=>p.kind==="ap").length+1; while(used.has(`AP-${pad2(i)}`)) i++;
    const p={id:uid(),kind:"ap",floor:f.id,x,y,label:`AP-${pad2(i)}`,room:"",model:"",ip:"",mac:"",ssids:"",band:"",poe:"",range:.12,up:null,note:""}; s.pins.push(p); sel={dev:null,port:null,slot:null,pin:p.id}; placeMode=null; }

  else { const taken=new Set(s.pins.filter(p=>p.kind==="rack").map(p=>p.rack)); const r=siteRacks().find(x=>!taken.has(x.id));

/* move one end of a cable to another port; the other end stays put */
function canDrop(ra,a,i,rb,b,j){
  if(a.id===b.id&&i===j) return {ok:false};
  const src=a.ports[i], tgt=b.ports[j];
  if(pointsAt(ra,src,rb,b,j)) return {ok:false,msg:"That's the other end of this cable."};
  if(tgt.link||tgt.ext) return {ok:false,msg:`${portName(b,j)} is already in use. Disconnect it first.`};
  return {ok:true};
}
function movePortEnd(ra,a,i,rb,b,j){
  const c=canDrop(ra,a,i,rb,b,j); if(!c.ok){ if(c.msg) toast(c.msg); return false; }
  const src=a.ports[i], tgt=b.ports[j], cab={cable:src.cable,color:src.color,len:src.len}, bn=(rb.id!==ra.id?rb.name+" · ":"")+portName(b,j);
  if(src.link){ const pe=peer(ra,src);
    src.link=null; Object.assign(src,{cable:"",color:"",len:""});
    if(pe){ tgt.link=mkLink(rb,pe.r,pe.d,pe.i); pe.pt.link=mkLink(pe.r,rb,b,j); touch(pe.r); } Object.assign(tgt,cab);
    toast(`Cable moved to ${bn}. Other end stays on ${peerName(rb,pe)}.`); }
  else if(src.ext){ tgt.ext=src.ext; Object.assign(tgt,cab); src.ext=""; Object.assign(src,{cable:"",color:"",len:""});
    toast(`Cable to ${tgt.ext} moved to ${bn}.`); }
  else { linkPorts(ra,a,i,rb,b,j); toast(`Connected ${portName(a,i)} to ${bn}.`); }
  touch(ra); touch(rb); curId=rb.id;
  sel={dev:b.id,port:j,slot:null,pin:null}; $("#insp").dataset.pendDev=""; saveRack(); return true;
}

/* ---------- floor plan geometry: rotation + crop, kept non-destructive ---------- */
function planGeom(pl){ const W=pl?.w||1600, H=pl?.h||1000, t=(pl?.rot||0)*Math.PI/180, c=Math.abs(Math.cos(t)), s=Math.abs(Math.sin(t));
  const RW=W*c+H*s, RH=W*s+H*c, cr=pl?.crop||{x:0,y:0,w:1,h:1}; return {W,H,t,RW,RH,cr,DW:cr.w*RW,DH:cr.h*RH}; }
function imgStyle(pl){ const g=planGeom(pl); const cx=(g.RW/2-g.cr.x*g.RW)/g.DW*100, cy=(g.RH/2-g.cr.y*g.RH)/g.DH*100;
  return `left:${cx}%;top:${cy}%;width:${g.W/g.DW*100}%;height:${g.H/g.DH*100}%;transform:translate(-50%,-50%) rotate(${pl?.rot||0}deg)`; }
function dispToImg(fx,fy,pl){ const g=planGeom(pl); const xr=g.cr.x*g.RW+fx*g.DW, yr=g.cr.y*g.RH+fy*g.DH, dx=xr-g.RW/2, dy=yr-g.RH/2, c=Math.cos(g.t), s=Math.sin(g.t);
  return {x:c*dx+s*dy+g.W/2, y:-s*dx+c*dy+g.H/2}; }
function imgToRot(x,y,pl){ const g=planGeom(pl), dx=x-g.W/2, dy=y-g.H/2, c=Math.cos(g.t), s=Math.sin(g.t); return {x:c*dx-s*dy+g.RW/2, y:s*dx+c*dy+g.RH/2}; }
function imgToDisp(x,y,pl){ const g=planGeom(pl), r=imgToRot(x,y,pl); return {fx:(r.x-g.cr.x*g.RW)/g.DW, fy:(r.y-g.cr.y*g.RH)/g.DH}; }

     <label class="pe-fine" for="peFine">Straighten <input type="range" id="peFine" min="-45" max="45" step="0.5" value="${fine}"><span class="mono" id="peFineVal">${fine.toFixed(1)}°</span></label>
   </div>

  $("#peCancel").onclick=()=>{ pe=null; closeModal(); };

function peDraw(){
  if(!pe?.img) return; const st=$("#peStage"), cv=$("#peCanvas"); if(!st||!cv) return;
  const g=planGeom({w:pe.w,h:pe.h,rot:pe.rot}); const k=Math.min((st.clientWidth-24)/g.RW,(st.clientHeight-24)/g.RH);
  const cw=Math.max(1,Math.round(g.RW*k)), ch=Math.max(1,Math.round(g.RH*k)), dpr=window.devicePixelRatio||1;
  cv.width=cw*dpr; cv.height=ch*dpr; cv.style.width=cw+"px"; cv.style.height=ch+"px"; $("#peWrap").style.width=cw+"px"; $("#peWrap").style.height=ch+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
  x.save(); x.translate(cw/2,ch/2); x.rotate(g.t); x.drawImage(pe.img,-pe.w*k/2,-pe.h*k/2,pe.w*k,pe.h*k); x.restore();
  // show where wall ports will land
  const s=site(), f=s?.floors.find(z=>z.id===pe.fid);
  for(const p of (s?.pins||[]).filter(p=>p.floor===pe.fid)){ const im=dispToImg(p.x,p.y,f.plan), r=imgToRot(im.x,im.y,{w:pe.w,h:pe.h,rot:pe.rot});
    x.beginPath(); x.arc(r.x*k,r.y*k,4,0,Math.PI*2); x.fillStyle=p.kind==="rack"?"#15202b":"#1d5bd3"; x.fill(); x.lineWidth=1.5; x.strokeStyle="#fff"; x.stroke(); }
  peCropStyle();
}
function peCropStyle(){ const c=pe.crop, el=$("#peCrop"); if(!el) return; Object.assign(el.style,{left:c.x*100+"%",top:c.y*100+"%",width:c.w*100+"%",height:c.h*100+"%"}); }
function bindCrop(){
  const wrap=$("#peWrap"); let dr=null; const MIN=.04;
  wrap.addEventListener("pointerdown",e=>{
    const b=wrap.getBoundingClientRect(), m=e.target.dataset.m || "new";
    const px=(e.clientX-b.left)/b.width, py=(e.clientY-b.top)/b.height;
    dr={m,px,py,b,start:{...pe.crop}}; wrap.setPointerCapture(e.pointerId); e.preventDefault();
    if(m==="new") pe.crop={x:px,y:py,w:0,h:0};
  });
  wrap.addEventListener("pointermove",e=>{
    if(!dr) return; const {b,start:s0}=dr; const px=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)), py=Math.max(0,Math.min(1,(e.clientY-b.top)/b.height));
    const dx=px-dr.px, dy=py-dr.py; let {x,y,w,h}=s0;
    if(dr.m==="move"){ x=Math.max(0,Math.min(1-w,x+dx)); y=Math.max(0,Math.min(1-h,y+dy)); }
    else if(dr.m==="new"){ x=Math.min(dr.px,px); y=Math.min(dr.py,py); w=Math.abs(px-dr.px); h=Math.abs(py-dr.py); }
    else { let x2=x+w, y2=y+h;
      if(dr.m.includes("w")) x=Math.min(x2-MIN,Math.max(0,x+dx)); if(dr.m.includes("e")) x2=Math.max(x+MIN,Math.min(1,x2+dx));
      if(dr.m.includes("n")) y=Math.min(y2-MIN,Math.max(0,y+dy)); if(dr.m.includes("s")) y2=Math.max(y+MIN,Math.min(1,y2+dy));
      w=x2-x; h=y2-y; }
    pe.crop={x,y,w,h}; peCropStyle();
  });
  const end=()=>{ if(!dr) return; if(pe.crop.w<MIN||pe.crop.h<MIN) pe.crop={...dr.start}; dr=null; peCropStyle(); };

}
function savePlanEdit(){
  const s=site(), f=s?.floors.find(z=>z.id===pe?.fid); if(!f?.plan){ closeModal(); return; }
  const old={...f.plan}, np={...f.plan,rot:pe.rot,crop:{...pe.crop}};

    if(d.fx<0||d.fx>1||d.fy<0||d.fy>1) edge++; p.x=d.fx; p.y=d.fy; }
  f.plan=np; pe=null; closeModal(); saveSite();

/* ---------- floor plan upload ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej({code:"pdf_load"}); document.head.appendChild(sc); }); }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej({code:"bad_image"}); i.src=src; }); }
function canvasBlob(c,type,q){ return new Promise(res=>c.toBlob(res,type,q)); }
function drawTo(img,max){ const w0=img.naturalWidth||1600, h0=img.naturalHeight||1000, k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement("canvas"); c.width=Math.round(w0*k); c.height=Math.round(h0*k); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); return c; }
async function pdfToBlob(file){
  if(!window.pdfjsLib){ await loadScript(PDFJS+"pdf.worker.min.js"); await loadScript(PDFJS+"pdf.min.js"); }
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const page=await pdf.getPage(1);
  const v0=page.getViewport({scale:1}); const vp=page.getViewport({scale:Math.min(4,2600/Math.max(v0.width,v0.height))});
  const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise; return await canvasBlob(c,"image/png");
}
async function getAssets(){ if(assetsNs===undefined){ try{ assetsNs = window.claude?.use ? await window.claude.use("assets") : null; }catch(e){ assetsNs=null; } } return assetsNs; }
async function handlePlanFile(file){
  const s=site(), f=floor(); if(!s||!f||!file||readOnly) return;
  toast("Preparing floor plan…");
  try{
    let blob=file, type=file.type;
    if(type==="application/pdf"||/\.pdf$/i.test(file.name)){ blob=await pdfToBlob(file); type="image/png"; }
    if(!/^image\/(png|jpeg|gif|webp|svg\+xml)$/.test(type)) return toast("Use a PNG, JPG, WebP, SVG or PDF floor plan.");
    const url=URL.createObjectURL(blob); const img=await loadImg(url);
    let w=img.naturalWidth||1600, h=img.naturalHeight||1000;
    const old=f.plan;
    if(type!=="image/svg+xml" && (blob.size>15e6 || Math.max(w,h)>6000)){ const c=drawTo(img,4000); blob=await canvasBlob(c,"image/jpeg",.85); type="image/jpeg"; }
    f.plan=await storePlanImage(s,f,blob,type,w,h);
    URL.revokeObjectURL(url);
    persist("sites",s.id); render(); toast("Floor plan added. Use Rotate / crop to straighten or trim it.");
    if(old) dropPlanStorage(old);
  }catch(e){
    const c=e?.code;
    toast(c==="too_large"?"That file is too large. Use one under 20 MB.":c==="unsupported_type"?"That file type isn't supported. Use PNG, JPG, SVG or PDF.":c==="quota_or_state"?"Floor plan storage is full. Remove an old plan first.":c==="pdf_load"?"Couldn't load the PDF reader. Try a PNG or JPG export instead.":c==="bad_image"?"That image couldn't be read. Try another file.":"Couldn't add the floor plan. Try again, or use a PNG or JPG.");
  }
}

function closeModal(){ $("#modalRoot").innerHTML=""; }
function readImportFile(inp){ const f=inp.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ $("#impText").value=fr.result; }; fr.readAsText(f); }
function parseCSV(text){ const rows=[]; let row=[],cell="",qd=false; for(let i=0;i<text.length;i++){ const c=text[i];
  if(qd){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else qd=false; } else cell+=c; }
  else if(c==='"') qd=true; else if(c===","){ row.push(cell); cell=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); } return rows.filter(r=>r.some(x=>x.trim())); }
function normRack(r){ const id=uid(); const map={};
  const out={id,siteId:r.siteId||"",name:String(r.name||"Imported rack"),location:String(r.location||""),units:Math.max(1,Math.min(60,+r.units||42)),kind:RACK_KINDS[r.kind]?r.kind:"cabinet",numbering:r.numbering==="top"?"top":"bottom",width:["10","19","23"].includes(String(r.width))?String(r.width):"19",depth:String(r.depth||""),notes:String(r.notes||""),devices:[]};

function doImport(text){
  text=(text||"").trim(); if(!text) return toast("Choose a file or paste something to import.");
  if(text[0]==="{"||text[0]==="["){
    let data; try{ data=JSON.parse(text); }catch(e){ return toast("That JSON couldn't be read. Check it's a RackGrid backup."); }
    const rlist = Array.isArray(data) ? data : data.racks ? (Array.isArray(data.racks)?data.racks:Object.values(data.racks)) : (data.devices?[data]:[]);
    const slist = Array.isArray(data.sites) ? data.sites : data.sites ? Object.values(data.sites) : [];
    const rackMap={}, devMaps={}, siteMap={};
    for(const s of slist){ if(!s||typeof s!=="object") continue; const ns=clone(s); ns.id=uid(); siteMap[s.id]=ns.id; ns.name=ns.name||"Imported site"; ns.floors=(ns.floors||[]).map(f=>({id:f.id||uid(),name:f.name||"Floor",plan:f.plan&&f.plan.asset&&IN_CLAUDE?f.plan:null,_img:f.plan?.image&&data.images?.[f.plan.image]?{data:data.images[f.plan.image],w:f.plan.w,h:f.plan.h,rot:f.plan.rot,crop:f.plan.crop}:null})); if(!ns.floors.length) ns.floors=[{id:uid(),name:"Ground floor",plan:null}]; ns.pins=ns.pins||[]; S.sites[ns.id]=ns; }
    let added=0; for(const r of rlist){ if(!r||typeof r!=="object") continue; const {rack:nr,map}=normRack(r); rackMap[r.id]=nr.id; devMaps[r.id]=map;
      nr.siteId = siteMap[r.siteId] || (S.sites[r.siteId]?r.siteId:"") || curSite || ""; S.racks[nr.id]=nr; curId=nr.id; added++; }
    // cables between racks: point them at the imported copies
    for(const id of Object.values(rackMap)) for(const d of S.racks[id].devices) for(const p of d.ports) if(p.link?._r){ const nr=rackMap[p.link._r], nd=devMaps[p.link._r]?.[p.link._d]; p.link = nr&&nd ? {r:nr,d:nd,p:p.link.p} : null; }
    for(const id of Object.values(rackMap)) persist("racks",id);
    for(const s of slist){ const ns=S.sites[siteMap[s.id]]; if(!ns) continue; const pinMap={}; for(const p of ns.pins){ const nid=uid(); pinMap[p.id]=nid; p.id=nid; } for(const p of ns.pins){ if(hasUp(p)&&p.up){ if(p.up.pin) p.up = pinMap[p.up.pin] ? {pin:pinMap[p.up.pin],j:p.up.j} : null; else if(p.up.r){ const nr=rackMap[p.up.r], nd=devMaps[p.up.r]?.[p.up.d]; p.up = nr&&nd ? {r:nr,d:nd,p:p.up.p} : null; } } for(const x of jp(p)) if(x.link){ const nr=rackMap[x.link.r], nd=devMaps[x.link.r]?.[x.link.d]; x.link = nr&&nd ? {r:nr,d:nd,p:x.link.p} : null; } if(p.rack) p.rack=rackMap[p.rack]||""; } persist("sites",ns.id); }
    if(slist.length){ curSite=siteMap[slist[0].id]; curFloor=null; }
    // restore floor plan images included in the backup
    (async()=>{ let ok=0; for(const id of Object.values(siteMap)){ const ns=S.sites[id]; if(!ns) continue; let changed=false;
      for(const f of ns.floors){ const im=f._img; delete f._img; if(!im) continue; changed=true;
        try{ const blob=await (await fetch(im.data)).blob(); const pl=await storePlanImage(ns,f,blob,blob.type||"image/png",im.w,im.h); f.plan={...pl,rot:im.rot||0,...(im.crop?{crop:im.crop}:{})}; ok++; }catch(e){} }
      if(changed){ persist("sites",id); } }
      if(ok){ render(); toast(`Restored ${ok} floor plan${ok===1?"":"s"}.`); } })();
    closeModal(); sel={dev:null,port:null,slot:null,pin:null}; pickDefaults(); render();
    return toast(`Imported ${slist.length?`${slist.length} site${slist.length===1?"":"s"} and `:""}${added} rack${added===1?"":"s"}.`);
  }
  const rows=parseCSV(text); if(rows.length<2) return toast("The CSV needs a header row and at least one device.");
  const head=rows[0].map(h=>h.trim().toLowerCase()); const col=n=>head.indexOf(n);
  if(col("name")<0) return toast("The CSV needs a 'name' column.");
  let r=rack(); if(!r){ if(!site()) createSite(); createRack(); r=rack(); }
  let added=0, skipped=[];
  for(const row of rows.slice(1)){ const g=k=>col(k)>=0?(row[col(k)]||"").trim():"";
    const type=TYPES[g("type").toLowerCase()]?g("type").toLowerCase():"server"; const t=TYPES[type];
    const h=Math.max(1,parseInt(g("height"))||t.h); let u=parseInt(g("u"));
    if(!u||!fits(r,u,h)) u=firstFree(r,h); if(u==null){ skipped.push(g("name")); continue; }
    const spec=(g("rj45")||g("sfp")||g("lc")) ? [["rj45",+g("rj45")||0],["sfp",+g("sfp")||0],["lc",+g("lc")||0]] : t.ports;
    r.devices.push({id:uid(),name:g("name")||nextName(r,type),type,u,h,model:g("model"),serial:g("serial"),ip:g("ip"),notes:g("notes"),ports:makePorts(spec)}); added++; }
  closeModal(); view="rack"; saveRack(); toast(`Added ${added} device${added===1?"":"s"}${skipped.length?`. No room for: ${skipped.join(", ")}`:""}.`);
}

/* ---------- export ---------- */
async function offer(filename,data){
  let dl=null; try{ dl = window.claude?.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){ try{ await dl.save({filename,data}); toast("Saved "+filename+"."); return; }
    catch(e){ if(e?.code==="declined") return; if(e?.code==="rate_limited") return toast("A save is already open. Finish it first."); } }
  if(!IN_CLAUDE){ const type=filename.endsWith(".csv")?"text/csv":"application/json"; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast("Downloaded "+filename+"."); return; }
  $("#modalRoot").innerHTML=`<div class="veil" id="veil"><div class="modal"><h2>${esc(filename)}</h2><p class="hint">Downloads aren't available here. Copy this text and save it as <b>${esc(filename)}</b>.</p><textarea id="expText" readonly>${esc(data)}</textarea><div class="btnrow" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="cp">Copy</button><button class="btn primary" id="cl">Done</button></div></div></div>`;
  $("#cl").onclick=closeModal; $("#cp").onclick=()=>{ const ta=$("#expText"); if(navigator.clipboard) navigator.clipboard.writeText(data).then(()=>toast("Copied."),()=>{ ta.select(); toast("Press Ctrl+C to copy."); }); else ta.select(); };
}
async function exportJson(){ if(!Object.keys(S.sites).length && !Object.keys(S.racks).length) return toast("There's nothing to back up yet.");
  toast("Preparing backup…");
  const sites=clone(Object.values(S.sites)), images={}; let n=0, missed=0;
  for(const s of sites) for(const f of s.floors||[]) if(f.plan){
    try{ const b=await planBlob(f.plan); const ref="img"+(++n); images[ref]=await blobToDataURL(b); f.plan={w:f.plan.w,h:f.plan.h,rot:f.plan.rot||0,crop:f.plan.crop||null,image:ref}; }
    catch(e){ missed++; } }
  await offer(`rackgrid-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({app:"rackgrid",version:3,exported:new Date().toISOString(),sites,racks:Object.values(S.racks),images}));
  if(missed) toast(`${missed} floor plan image${missed===1?"":"s"} couldn't be included in the backup.`); }
function exportCsv(){ const r=rack(); const s=site(); if(!r&&!s) return toast("Select a site or rack first.");
  const c=v=>`"${String(v??"").replace(/"/g,'""')}"`; const lines=[["section","from","to","cable_id","color","length","ip","vlan","mac"].join(",")];
  if(r){ for(const x of cableRows(r)) lines.push(["cable",x.a,x.b,x.cable,x.color,x.len,"","",""].map(c).join(","));
    for(const x of ipRows(r)) lines.push(["ip",x.what,"","","","",x.ip,x.vlan,x.mac].map(c).join(",")); }
  if(s) for(const p of (s.pins||[]).filter(p=>p.kind==="jack")) jp(p).forEach((x,j)=>{ const t=trace(p,j); lines.push(["wall_port",`Wall port ${jname(p,j)} · ${floorName(s,p.floor)}${p.room?" · "+p.room:""}${x.endpoint?" · "+x.endpoint:""}`,t?`${portName(t.d,t.pi)}${t.o?" → "+portName(t.o,t.oi):""}`:"",x.cable||"","","",x.eip||"",t?.op?.vlan||"",x.mac||""].map(c).join(",")); });
  if(s) for(const a of (s.pins||[]).filter(p=>p.kind==="dev")){ const at=apTrace(s,a), sw=apSwitch(s,a); lines.push(["floor_device",`${devCat(a).label} ${a.label} · ${floorName(s,a.floor)}${a.room?" · "+a.room:""}${a.model?" · "+a.model:""}${a.user?" · "+a.user:""}`,`${at?.jack?"Wall port "+jname(at.jack,at.j):at?.direct?"Direct":""}${sw?" → "+portName(sw.d,sw.pi):""}`,"","","",a.ip||"",sw?.pt?.vlan||"",a.mac||""].map(c).join(",")); }
  if(s) for(const a of (s.pins||[]).filter(p=>p.kind==="ap")){ const at=apTrace(s,a), sw=apSwitch(s,a); lines.push(["access_point",`Access point ${a.label} · ${floorName(s,a.floor)}${a.room?" · "+a.room:""}${a.model?" · "+a.model:""}`,`${at?.jack?"Wall port "+jname(at.jack,at.j):at?.direct?"Direct":""}${sw?" → "+portName(sw.d,sw.pi):""}`,"","","",a.ip||"",sw?.pt?.vlan||"",a.mac||""].map(c).join(",")); }
  offer(`${(r?.name||s.name).replace(/[^\w-]+/g,"_")}-cables-ips.csv`, lines.join("\n")); }

let tt; function toast(m){ let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,3400); }

const WS_KEY="rg-ws", WS_LAST="rg-last-ws", WS_AUTO="rg-ws-auto", SB_CFG="rg-supabase", JOIN_KEY="rg-join";
const ICON_MON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
const ICON_TEAM='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.7 2.6 3 5.2"/></svg>';
const lsGet=(k,d=null)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };
const ssGet=k=>{ try{ return sessionStorage.getItem(k); }catch(e){ return null; } };
const ssSet=(k,v)=>{ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v); }catch(e){} };
const ROLE_LABEL={owner:"Owner",admin:"Administrator",member:"Member"};
const initials=n=>(n||"?").trim().split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("")||"?";
const hueOf=s=>{ let h=0; for(const c of String(s||"")) h=(h*31+c.charCodeAt(0))%360; return h; };
function relTime(t){ const d=(Date.now()-new Date(t))/1000; if(d<45) return "just now"; if(d<3600) return Math.round(d/60)+" min ago"; if(d<86400) return Math.round(d/3600)+" h ago"; if(d<7*86400) return Math.round(d/86400)+" d ago"; return new Date(t).toLocaleDateString(); }

function sbConfig(){
  const c=window.RACKGRID_CONFIG||{}; let o={}; try{ o=JSON.parse(lsGet(SB_CFG,"{}"))||{}; }catch(e){}
  const url=(o.url||c.supabaseUrl||"").trim(), key=(o.key||c.supabaseAnonKey||"").trim();
  return url&&key ? {url,key,fromApp:!!o.url} : null;
}
let sbClient=null;
function sb(){ if(sbClient) return sbClient; const c=sbConfig(); if(!c||!window.supabase?.createClient) return null;
  sbClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"rackgrid-auth"}}); return sbClient; }
const netErr=e=>{ const m=String(e?.message||e||""); return !navigator.onLine || /fetch|network|Load failed|timeout|ECONN|Failed to/i.test(m) || e?.status===0; };
const errText=e=>String(e?.message||e||"Something went wrong").replace(/^.*?ERROR:\s*/,"");

/* ---------- workspace screen ---------- */
const Workspace={
  resolve:null, step:"home", busy:false, user:null, teams:[], invite:null, msg:"",
  async choose(){
    const hashJoin=(location.hash.match(/join=([A-Za-z0-9-]+)/)||[])[1];
    if(hashJoin){ lsSet(JOIN_KEY,hashJoin.toUpperCase()); history.replaceState(null,"",location.pathname+location.search); }
    const cur=ssGet(WS_KEY);
    if(!lsGet(JOIN_KEY)){
      if(cur==="local") return {kind:"local"};
      if(cur?.startsWith("team:")) return {kind:"team",teamId:cur.slice(5)};
      if(lsGet(WS_AUTO)==="1" && !lsGet("rg-ws-skip")){ const last=lsGet(WS_LAST); if(last==="local"){ ssSet(WS_KEY,"local"); return {kind:"local"}; } if(last?.startsWith("team:")){ ssSet(WS_KEY,last); return {kind:"team",teamId:last.slice(5)}; } }
    }
    lsSet("rg-ws-skip",null);
    return new Promise(res=>{ this.resolve=res; this.step=lsGet(JOIN_KEY)?"team":"home"; this.mount(); if(this.step==="team") this.openTeam(); });
  },
  mount(){ let el=$("#ws"); if(!el){ el=document.createElement("div"); el.id="ws"; el.className="ws"; document.body.appendChild(el);
    el.addEventListener("click",e=>this.onClick(e)); el.addEventListener("submit",e=>{ e.preventDefault(); this.onSubmit(e.target); }); el.addEventListener("input",e=>{ if(e.target.id==="wsJoinCode") this.previewInvite(e.target.value); }); el.addEventListener("change",e=>{ if(e.target.id==="wsAuto") lsSet(WS_AUTO,e.target.checked?"1":null); }); }
    document.body.classList.add("ws-open"); this.render(); },
  done(ws){ const last=ws.kind==="local"?"local":"team:"+ws.teamId; ssSet(WS_KEY,last); lsSet(WS_LAST,last);
    $("#ws")?.remove(); document.body.classList.remove("ws-open"); const r=this.resolve; this.resolve=null; r?.(ws); },
  switch(){ ssSet(WS_KEY,null); lsSet("rg-ws-skip","1"); location.reload(); },
  card(icon,title,badge,cls,desc,btn,act,primary,extra=""){ return `<section class="ws-card"><header><span class="ws-ico">${icon}</span><h2>${title}</h2><span class="ws-badge ${cls}">${badge}</span></header><p>${desc}</p>${extra}<button class="ws-btn${primary?" primary":""}" data-ws="${act}">${btn}</button></section>`; },
  render(){
    const el=$("#ws"); if(!el) return;
    const head=`<div class="ws-head"><h1>RackGrid</h1><p class="ws-eyebrow">Workspace selection</p></div>`;
    const msg=this.msg?`<p class="ws-msg" role="status">${esc(this.msg)}</p>`:"";
    let body="";
    if(this.step==="home"){
      body=this.card(ICON_MON,"Personal Workspace","Private","priv","Open your locally saved racks and equipment.","Open Personal Workspace","local",false)
        +this.card(ICON_TEAM,"Team Workspace","Shared","shared","Create a team, join a team or access shared racks.","Open Team Workspace","team",true)
        +`<label class="ws-auto"><input type="checkbox" id="wsAuto" ${lsGet(WS_AUTO)==="1"?"checked":""}> Open my last workspace automatically next time</label>`;
    } else if(this.step==="config"){
      body=`<section class="ws-card"><header><span class="ws-ico">${ICON_TEAM}</span><h2>Connect team workspaces</h2></header>
        <p>Team workspaces sync through your own free Supabase project. Follow <b>SETUP.md</b> in the RackGrid repository once, then paste your project's URL and anon key here, or put them in <code>config.js</code> so everyone gets them.</p>
        <form class="ws-form" data-form="config"><label>Project URL<input name="url" placeholder="https://xxxx.supabase.co" required autocomplete="off"></label>
        <label>Anon public key<input name="key" placeholder="eyJhbGciOi…" required autocomplete="off"></label>
        <button class="ws-btn primary" type="submit">Connect</button></form>
        <button class="ws-link" data-ws="home">← Back</button></section>`;
    } else if(this.step==="auth"){
      const mode=this.authMode||"signin";
      body=`<section class="ws-card"><header><span class="ws-ico">${ICON_TEAM}</span><h2>${mode==="signup"?"Create your account":"Sign in to Team Workspace"}</h2><span class="ws-badge shared">Shared</span></header>
        ${lsGet(JOIN_KEY)?`<p>Sign in or create an account to join with code <b class="mono">${esc(lsGet(JOIN_KEY))}</b>.</p>`:`<p>${mode==="signup"?"Use your work email. You may need to confirm it before signing in.":"Use the account you created for RackGrid."}</p>`}
        <form class="ws-form" data-form="${mode}">
          ${mode==="signup"?`<label>Your name<input name="name" autocomplete="name" placeholder="Shown to your team" required></label>`:""}
          <label>Email<input name="email" type="email" autocomplete="email" required></label>
          <label>Password<input name="password" type="password" autocomplete="${mode==="signup"?"new-password":"current-password"}" minlength="8" ${mode==="magic"?"":"required"}></label>
          <button class="ws-btn primary" type="submit" ${this.busy?"disabled":""}>${this.busy?"Please wait…":mode==="signup"?"Create account":"Sign in"}</button>
        </form>
        <div class="ws-row">${mode==="signup"?`<button class="ws-link" data-ws="authsignin">I already have an account</button>`:`<button class="ws-link" data-ws="authsignup">Create an account</button><button class="ws-link" data-ws="magic">Email me a sign-in link instead</button>`}</div>
        <button class="ws-link" data-ws="home">← Back</button></section>`;
    } else if(this.step==="teams"){
      const join=lsGet(JOIN_KEY)||"";
      body=`<section class="ws-card"><header><span class="ws-ico">${ICON_TEAM}</span><h2>Your teams</h2><span class="ws-badge shared">Shared</span></header>
        <p class="ws-who">Signed in as <b>${esc(this.user?.email||"")}</b> · <button class="ws-link" data-ws="signout">Sign out</button></p>
        ${this.teams.length?`<div class="ws-list">${this.teams.map(t=>`<button class="ws-team" data-ws="open" data-team="${t.id}"><span class="ws-av" style="--h:${hueOf(t.id)}">${esc(initials(t.name))}</span><span><b>${esc(t.name)}</b><small>${ROLE_LABEL[t.role]||t.role}</small></span><span class="ws-go">Open →</span></button>`).join("")}</div>`
          :`<p class="ws-empty">You're not in a team yet. Create one for your organization or join with an invitation code.</p>`}
      </section>
      <section class="ws-card"><header><h2>Join a team</h2></header>
        <form class="ws-form" data-form="join"><label>Invitation code or link<input id="wsJoinCode" name="code" value="${esc(join)}" placeholder="RG-XXXX-XXXX" required autocomplete="off"></label>
        <div id="wsInvite" class="ws-invite">${this.inviteHtml()}</div>
        <label>Your name in this team<input name="name" value="${esc(this.defaultName())}" required></label>
        <button class="ws-btn" type="submit" ${this.busy?"disabled":""}>Join team</button></form></section>
      <section class="ws-card"><header><h2>Create a team</h2></header><p>Create a workspace for your organization. You'll be its owner and can invite people right away.</p>
        <form class="ws-form" data-form="create"><label>Team name<input name="team" placeholder="e.g. Acme IT" required maxlength="80"></label>
        <label>Your name<input name="name" value="${esc(this.defaultName())}" required></label>
        ${this.hasLocalData()?`<label class="ws-check"><input type="checkbox" name="copy" checked> Copy my Personal Workspace into this team (${this.localSummary()})</label>`:""}
        <button class="ws-btn primary" type="submit" ${this.busy?"disabled":""}>Create team</button></form></section>
      <button class="ws-link" data-ws="home">← Back to workspace selection</button>`;
    }
    el.innerHTML=`<div class="ws-shell">${head}${msg}${body}</div>`;
    if(this.step==="teams" && lsGet(JOIN_KEY) && !this.invite) this.previewInvite(lsGet(JOIN_KEY));
  },
  defaultName(){ return this.user?.user_metadata?.name || (this.user?.email||"").split("@")[0] || ""; },
  hasLocalData(){ try{ return Object.keys(JSON.parse(lsGet(LSKEY.racks,"{}"))).length+Object.keys(JSON.parse(lsGet(LSKEY.sites,"{}"))).length>0; }catch(e){ return false; } },
  localSummary(){ try{ const s=Object.keys(JSON.parse(lsGet(LSKEY.sites,"{}"))).length, r=Object.keys(JSON.parse(lsGet(LSKEY.racks,"{}"))).length; return `${s} site${s===1?"":"s"}, ${r} rack${r===1?"":"s"}`; }catch(e){ return ""; } },
  inviteHtml(){ const i=this.invite; if(!i) return ""; if(i.loading) return `<span class="muted">Checking code…</span>`;
    if(!i.valid) return `<span class="bad">${esc(i.reason||"That code isn't valid.")}</span>`;
    return `<span class="good">${i.already_member?"You're already in":"Joins"} <b>${esc(i.team_name)}</b> as ${esc(ROLE_LABEL[i.role]||i.role)}</span>`; },
  previewTimer:0,
  previewInvite(v){ clearTimeout(this.previewTimer); const code=(String(v).match(/RG-[A-Z0-9]{4}-[A-Z0-9]{4}/i)||[])[0];
    if(!code){ this.invite=null; const b=$("#wsInvite"); if(b) b.innerHTML=""; return; }
    this.invite={loading:true}; const b0=$("#wsInvite"); if(b0) b0.innerHTML=this.inviteHtml();
    this.previewTimer=setTimeout(async()=>{ const {data,error}=await sb().rpc("invite_info",{p_code:code.toUpperCase()}); this.invite=error?{valid:false,reason:netErr(error)?"Can't check the code while offline.":errText(error)}:data; const b=$("#wsInvite"); if(b) b.innerHTML=this.inviteHtml(); },300); },
  async openTeam(){
    if(!sbConfig()){ this.step="config"; this.render(); return; }
    if(!window.supabase?.createClient){ this.msg="The sync library didn't load. Check your connection and reload."; this.step="home"; this.render(); return; }
    const {data:{session}}=await sb().auth.getSession();
    this.user=session?.user||null;
    if(!this.user){ this.step="auth"; this.render(); return; }
    await this.loadTeams(); this.step="teams"; this.render();
  },
  async loadTeams(){
    const {data,error}=await sb().from("team_members").select("role,team_id,teams(id,name)").eq("user_id",this.user.id);

const canon=v=>v===undefined?"u":JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
const same=(a,b)=>canon(a)===canon(b);
const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&typeof x.id==="string");
// three-way merge: base = last copy both sides agreed on; local = this device; remote = server
function merge3(b,l,r){
  if(same(l,b)) return clone(r===undefined?null:r)??undefined;
  if(same(r,b)||same(l,r)) return l===undefined?undefined:clone(l);
  if(isObj(l)&&isObj(r)){ const out={}, bb=isObj(b)?b:{};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
      if(!(k in l)&&(k in bb)&&same(r[k],bb[k])) continue;
      if(!(k in r)&&(k in bb)&&same(l[k],bb[k])) continue;
      const v=merge3(bb[k],l[k],r[k]); if(v!==undefined) out[k]=v; }
    return out; }
  if(idArr(l)&&idArr(r)){ const bm=new Map((idArr(b)?b:[]).map(x=>[x.id,x])), lm=new Map(l.map(x=>[x.id,x])), rm=new Map(r.map(x=>[x.id,x])), out=[];
    const order=[...r.map(x=>x.id)]; l.forEach((x,i)=>{ if(!rm.has(x.id)){ const prev=i>0?order.indexOf(l[i-1].id):-1; order.splice(prev+1,0,x.id); } });
    for(const id of order){ const inB=bm.has(id), inL=lm.has(id), inR=rm.has(id);
      if(inL&&inR){ out.push(merge3(bm.get(id),lm.get(id),rm.get(id))); continue; }
      if(inL&&!inR){ if(inB&&same(lm.get(id),bm.get(id))) continue; out.push(clone(lm.get(id))); continue; }
      if(inR&&!inL){ if(inB&&same(rm.get(id),bm.get(id))) continue; out.push(clone(rm.get(id))); } }
    return out; }
  if(Array.isArray(l)&&Array.isArray(r)&&Array.isArray(b)&&l.length===r.length&&r.length===b.length) return l.map((x,i)=>merge3(b[i],x,r[i]));
  return l===undefined?undefined:clone(l);
}
